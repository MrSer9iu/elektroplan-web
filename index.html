<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ElektroPlan">
<meta name="theme-color" content="#0F1623">
<title>ElektroPlan</title>
<style>
:root{--bg:#0F1623;--sb:#1A1F2E;--bd:#2D3448;--mu:#6B7280;--bl:#4FC3F7;--gr:#22C55E;--rd:#EF5350;--yw:#d97706;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:-apple-system,sans-serif;color:#fff;}
#app{display:flex;flex-direction:column;height:100%;}

/* TOPBAR */
#topbar{height:50px;background:#0A0F1A;border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 10px;gap:5px;flex-shrink:0;overflow-x:auto;}
#menu-btn{display:flex;align-items:center;gap:5px;padding:6px 10px;background:linear-gradient(135deg,#4FC3F7,#0288D1);border-radius:8px;border:none;color:#fff;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0;}
#sd{width:8px;height:8px;border-radius:50%;background:var(--mu);flex-shrink:0;}
#st{font-size:12px;color:var(--mu);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:60px;}
.tbb{width:34px;height:34px;background:#1A2035;border:none;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:background .15s;color:#9CA3AF;}
.tbb:disabled{opacity:.3;cursor:default;}
.tbb:not(:disabled):active{background:#243050;}
.tbb svg{width:17px;height:17px;}
.tsep{width:1px;height:28px;background:var(--bd);flex-shrink:0;}
.tbch{display:flex;align-items:center;gap:4px;padding:4px 8px;background:#1A2035;border-radius:20px;font-size:10px;color:var(--mu);white-space:nowrap;flex-shrink:0;}

/* MAIN */
#main{display:flex;flex:1;overflow:hidden;}

/* SIDEBAR */
#sb{width:82px;background:var(--sb);border-right:1px solid var(--bd);display:flex;flex-direction:column;align-items:center;padding:5px 0;overflow-y:auto;flex-shrink:0;gap:1px;scrollbar-width:none;}
#sb::-webkit-scrollbar{display:none;}
.sdiv{width:58px;height:1px;background:var(--bd);margin:3px 0;flex-shrink:0;}
.slbl{font-size:8px;letter-spacing:.8px;text-transform:uppercase;padding:0 4px;text-align:center;}
.tb{width:70px;padding:5px 3px;border-radius:10px;border:1px solid transparent;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:8px;line-height:1.2;text-align:center;flex-shrink:0;transition:all .15s;color:var(--mu);}
.tb img,.tb svg{flex-shrink:0;}
.tb.abl{background:rgba(79,195,247,.12);color:#4FC3F7;border-color:rgba(79,195,247,.4);}
.tb.agr{background:rgba(26,140,61,.1);color:#22C55E;border-color:rgba(26,140,61,.35);}
.tb.ard{background:rgba(239,83,80,.1);color:#EF5350;border-color:rgba(239,83,80,.35);}
.tb.atn{background:rgba(52,211,153,.1);color:#34D399;border-color:rgba(52,211,153,.35);}
.tb.ayw{background:rgba(217,119,6,.1);color:#d97706;border-color:rgba(217,119,6,.35);}
.tkr{display:flex;gap:4px;padding:2px;}
.tkb{width:22px;height:22px;border-radius:5px;border:1px solid transparent;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--mu);}
.tkb.a{background:rgba(79,195,247,.12);border-color:rgba(79,195,247,.4);color:#4FC3F7;}
.tkl{background:currentColor;border-radius:1px;width:14px;}
.clr{display:flex;flex-wrap:wrap;gap:4px;padding:3px 6px;justify-content:center;}
.cd{width:16px;height:16px;border-radius:50%;cursor:pointer;border:2px solid transparent;}
.cd.a{border-color:#fff;}

/* CANVAS */
#cw{flex:1;position:relative;overflow:hidden;background:#EFF3F8;}
#cv{position:absolute;top:0;left:0;touch-action:none;cursor:crosshair;}

/* STATS */
#statsbar{height:46px;background:#0A0F1A;border-top:1px solid var(--bd);display:flex;align-items:center;padding:0 12px;gap:7px;overflow-x:auto;flex-shrink:0;scrollbar-width:none;}
#statsbar::-webkit-scrollbar{display:none;}
.sc{display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;flex-shrink:0;}

/* CONTEXT MENU */
#cm{position:fixed;background:#1A2235;border-radius:12px;padding:6px 0;box-shadow:0 8px 32px rgba(0,0,0,.6);z-index:999;min-width:195px;display:none;border:1px solid var(--bd);}
#cm.s{display:block;}
.ci{display:flex;align-items:center;gap:10px;padding:11px 16px;font-size:13px;color:#fff;cursor:pointer;border:none;background:none;width:100%;text-align:left;}
.ci:active{background:rgba(255,255,255,.06);}
.ci.d{color:var(--rd);}
.csep{height:1px;background:var(--bd);margin:3px 0;}

/* DROPDOWN */
#dd{position:fixed;background:#1A2235;border-radius:12px;padding:6px 0;box-shadow:0 8px 32px rgba(0,0,0,.7);z-index:999;min-width:210px;display:none;border:1px solid var(--bd);top:54px;left:10px;}
#dd.s{display:block;}
.di{display:flex;align-items:center;gap:10px;padding:11px 16px;font-size:13px;color:#fff;cursor:pointer;border:none;background:none;width:100%;text-align:left;}
.di:active{background:rgba(255,255,255,.05);}
.di.d{color:var(--rd);}
.dsep{height:1px;background:var(--bd);margin:3px 0;}

/* OVERLAY DIALOGS */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:1000;display:none;align-items:center;justify-content:center;}
.ov.s{display:flex;}
.dlg{background:#1A2235;border-radius:16px;padding:22px;min-width:300px;max-width:430px;width:92%;border:1px solid var(--bd);}
.dlg h3{color:#fff;font-size:18px;margin-bottom:14px;}
.dlg p{color:var(--mu);font-size:14px;margin-bottom:14px;}
.dlg label{color:var(--mu);font-size:13px;display:block;margin-bottom:7px;}
.dlg input{width:100%;background:#0F1623;border:1px solid #374151;border-radius:10px;padding:12px;color:#fff;font-size:22px;text-align:center;outline:none;}
.dlg input[type=text]{font-size:15px;text-align:left;}
.dlg input:focus{border-color:var(--bl);box-shadow:0 0 0 2px rgba(79,195,247,.2);}
.dbtns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;}
.bc{background:none;border:none;color:var(--mu);padding:8px 14px;border-radius:8px;cursor:pointer;font-size:13px;}
.bo{background:var(--bl);border:none;color:#000;padding:8px 18px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:700;}
.bda{background:var(--rd);border:none;color:#fff;padding:8px 18px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:700;}
</style>
</head>

  sicherung:   {l:'Sicherungskasten', c:'#1a8c3d', s:'Sicherungskästen', cat:'dist'},
  data:        {l:'Datensteckdose',   c:'#1a8c3d', s:'Datensteckdosen',  cat:'data'},
  netzwerk:    {l:'Netzwerkdose',     c:'#1a8c3d', s:'Netzwerkdosen',    cat:'data'},
  antenne:     {l:'Antennendose',     c:'#1a8c3d', s:'Antennendosen',    cat:'data'},
  telefon:     {l:'Telefondose',      c:'#1a8c3d', s:'Telefondosen',     cat:'data'},
  // Yellow/Red - Light
  licht:       {l:'Lichtpunkt',       c:'#b45309', s:'Lichtpunkte',      cat:'light'},
  leuchte:     {l:'Leuchte',          c:'#b45309', s:'Leuchten',         cat:'light'},
  spot:        {l:'Einbaustrahler',   c:'#b45309', s:'Einbaustrahler',   cat:'light'},
  aussen:      {l:'Außenleuchte',     c:'#b45309', s:'Außenleuchten',    cat:'light'},
};

// Wall snap threshold in canvas coords
const SNAP_WALL = 30;
const SNAP_EP   = 20;

// ═══════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════
let walls=[], symbols=[], doors=[], windows2=[];
let US=[], RS=[];
let tool='none', selSym=null;
let wallThk=12, wallClr='#2D3748';
let pn='Neues Projekt';
let vx=0, vy=0, vs=1;
// Drawing
let drawS=null, drawE=null, snapEnd=false;
// Drag
let dragSi=null, dragWi=null, dragPrev=null;
// Pan
let panS=null, panO=null;
// Pinch
let pinD0=0, pinS0=1, pinVx=0, pinVy=0, pinM=null;
let isPinching=false;

// Preloaded images
const imgCache={};
function getImg(type){
  if(!ICONS||!ICONS[type])return null;
  if(imgCache[type])return imgCache[type];
  const img=new Image(); img.src=ICONS[type];
  img.onload=()=>render(); imgCache[type]=img; return img;
}

// ═══════════════════════════════════════════════════
// CANVAS SETUP
// ═══════════════════════════════════════════════════
let cv, cx, cw;
function initCanvas(){
  cv=document.getElementById('cv');
  cx=cv.getContext('2d');
  cw=document.getElementById('cw');
  resize();
  cv.addEventListener('touchstart',onTS,{passive:false});
  cv.addEventListener('touchmove',onTM,{passive:false});
  cv.addEventListener('touchend',onTE,{passive:false});
  cv.addEventListener('click',onCK);
  cv.addEventListener('dblclick',onDCK);
  window.addEventListener('resize',resize);
  window.addEventListener('keydown',onKey);
}
function resize(){
  if(!cv)return;
  cv.width=cw.clientWidth; cv.height=cw.clientHeight; render();
}

// ═══════════════════════════════════════════════════
// COORDS
// ═══════════════════════════════════════════════════
const tC=(sx,sy)=>({x:(sx-vx)/vs, y:(sy-vy)/vs});
const tS=(cx2,cy2)=>({x:cx2*vs+vx, y:cy2*vs+vy});
function getXY(e){
  const r=cv.getBoundingClientRect();
  const t=e.touches?e.touches[0]:e;
  return{x:t.clientX-r.left, y:t.clientY-r.top};
}

// ═══════════════════════════════════════════════════
// UNDO/REDO
// ═══════════════════════════════════════════════════
function snap(){
  US.push({w:J(walls),s:J(symbols),d:J(doors),wn:J(windows2)});
  if(US.length>60)US.shift();
  RS=[]; updUR();
}
function undo(){
  if(!US.length)return;
  RS.push({w:J(walls),s:J(symbols),d:J(doors),wn:J(windows2)});
  const u=US.pop(); walls=u.w; symbols=u.s; doors=u.d; windows2=u.wn;
  updUR(); updStats(); render();
}
function redo(){
  if(!RS.length)return;
  US.push({w:J(walls),s:J(symbols),d:J(doors),wn:J(windows2)});
  const u=RS.pop(); walls=u.w; symbols=u.s; doors=u.d; windows2=u.wn;
  updUR(); updStats(); render();
}
const J=x=>JSON.parse(JSON.stringify(x));
function updUR(){
  const bu=document.getElementById('bundo'),br=document.getElementById('bredo');
  if(bu)bu.disabled=!US.length;
  if(br)br.disabled=!RS.length;
}
function onKey(e){
  if((e.ctrlKey||e.metaKey)&&e.key==='z'){e.preventDefault();undo();}
  if((e.ctrlKey||e.metaKey)&&(e.key==='y'||(e.shiftKey&&e.key==='Z'))){e.preventDefault();redo();}
  if(e.key==='Escape'){closeAllMenus();tool='none';selSym=null;setTool('none');}
}

// ═══════════════════════════════════════════════════
// TOOLS
// ═══════════════════════════════════════════════════
function setTool(t){
  tool=t; selSym=null;
  document.querySelectorAll('.tb').forEach(b=>b.classList.remove('abl','agr','ard','atn','ayw'));
  const map={wall:'tw',pan:'tp'};
  if(map[t])document.getElementById(map[t])?.classList.add(t==='wall'?'abl':t==='pan'?'atn':'abl');
  const msgs={
    wall:'✏️  Wand zeichnen — ziehen, Länge eingeben',
    pan:'✋  Verschieben / Zoomen',
    none:'Tippen zum Auswählen'
  };
  setSt(msgs[t]||msgs.none, t==='wall'?'#4FC3F7':t==='pan'?'#34D399':'#6B7280');
}
function setSym(s){
  tool='sym'; selSym=s;
  document.querySelectorAll('.tb').forEach(b=>b.classList.remove('abl','agr','ard','atn','ayw'));
  const isLight=SD[s]?.cat==='light';
  document.getElementById('sy-'+s)?.classList.add(isLight?'ayw':'agr');
  setSt('⚡ '+SD[s]?.l+' platzieren', isLight?'#d97706':'#22C55E');
}
function setSt(t,c){
  const el=document.getElementById('st'); if(el){el.textContent=t;el.style.color=c;}
  const dot=document.getElementById('sd'); if(dot)dot.style.background=c;
}
function setThk(t){
  wallThk=t;
  ['tkt','tkn','tkb'].forEach(id=>document.getElementById(id)?.classList.remove('a'));
  const map={3:'tkt',6:'tkn',12:'tkb'}; // approximate half-widths
  // find which button
  if(t<=4)document.getElementById('tkt')?.classList.add('a');
  else if(t<=8)document.getElementById('tkn')?.classList.add('a');
  else document.getElementById('tkb')?.classList.add('a');
}
function setWC(c,el){
  wallClr=c;
  document.querySelectorAll('.cd').forEach(d=>d.classList.remove('a'));
  el.classList.add('a');
}

// ═══════════════════════════════════════════════════
// HIT TESTS
// ═══════════════════════════════════════════════════
function hitWall(cx2,cy2,thr=12){
  const t=thr/vs;
  for(let i=walls.length-1;i>=0;i--){
    const w=walls[i],dx=w.ex-w.sx,dy=w.ey-w.sy,l2=dx*dx+dy*dy;
    if(!l2)continue;
    const tv=Math.max(0,Math.min(1,((cx2-w.sx)*dx+(cy2-w.sy)*dy)/l2));
    if(Math.hypot(cx2-(w.sx+tv*dx),cy2-(w.sy+tv*dy))<t)return i;
  }return -1;
}
function hitSym(cx2,cy2,thr=24){
  const t=thr/vs;
  for(let i=symbols.length-1;i>=0;i--)
    if(Math.hypot(symbols[i].x-cx2,symbols[i].y-cy2)<t)return i;
  return -1;
}
function snapEP(cx2,cy2,thr=SNAP_EP){
  let b=null,md=thr/vs;
  for(const w of walls)for(const p of [{x:w.sx,y:w.sy},{x:w.ex,y:w.ey}]){
    const d=Math.hypot(p.x-cx2,p.y-cy2);if(d<md){md=d;b=p;}
  }return b;
}
function sAx(sx,sy,ex,ey){
  const dx=Math.abs(ex-sx),dy=Math.abs(ey-sy);
  return dx>dy?{x:ex,y:sy}:{x:sx,y:ey};
}

// Snap symbol to nearest wall
function snapSymToWall(cx2,cy2){
  let best=null,md=SNAP_WALL/vs;
  for(const w of walls){
    const dx=w.ex-w.sx,dy=w.ey-w.sy,l2=dx*dx+dy*dy;
    if(!l2)continue;
    const tv=Math.max(0,Math.min(1,((cx2-w.sx)*dx+(cy2-w.sy)*dy)/l2));
    const px=w.sx+tv*dx,py=w.sy+tv*dy;
    const d=Math.hypot(cx2-px,cy2-py);
    if(d<md){md=d;best={x:px,y:py,wallAngle:Math.atan2(dy,dx)};}
  }
  return best;
}

function ppm(){
  for(const w of walls){
    if(w.len&&w.len>0){const px=Math.hypot(w.ex-w.sx,w.ey-w.sy);if(px>0)return px/w.len;}
  }return 80;
}

// ═══════════════════════════════════════════════════
// TOUCH/MOUSE EVENTS
// ═══════════════════════════════════════════════════
function onTS(e){
  e.preventDefault();
  if(e.touches.length===2){
    isPinching=true;
    const r=cv.getBoundingClientRect(),t1=e.touches[0],t2=e.touches[1];
    pinD0=Math.hypot(t1.clientX-t2.clientX,t1.clientY-t2.clientY);
    pinS0=vs;pinVx=vx;pinVy=vy;
    pinM={x:(t1.clientX+t2.clientX)/2-r.left,y:(t1.clientY+t2.clientY)/2-r.top};
    dragSi=null;dragWi=null;drawS=null;return;
  }
  isPinching=false;
  const p=getXY(e);stI(p.x,p.y);
}
function onTM(e){
  e.preventDefault();
  if(e.touches.length===2||isPinching){
    const r=cv.getBoundingClientRect(),t1=e.touches[0],t2=e.touches[1];
    const d=Math.hypot(t1.clientX-t2.clientX,t1.clientY-t2.clientY);
    const ns=Math.max(0.15,Math.min(10,pinS0*d/pinD0));
    const fc={x:(pinM.x-pinVx)/pinS0,y:(pinM.y-pinVy)/pinS0};
    const mid={x:(t1.clientX+t2.clientX)/2-r.left,y:(t1.clientY+t2.clientY)/2-r.top};
    vs=ns;vx=mid.x-fc.x*ns;vy=mid.y-fc.y*ns;render();return;
  }
  const p=getXY(e);mvI(p.x,p.y);
}
function onTE(e){
  e.preventDefault();
  if(isPinching&&e.touches.length<2){isPinching=false;}
  if(e.touches.length>0)return;
  enI();
}
function onCK(e){
  if(dragSi!==null||dragWi!==null)return;
  const p=getXY(e),cp=tC(p.x,p.y);
  const si=hitSym(cp.x,cp.y,26);
  if(si>=0&&tool!=='sym'&&tool!=='wall'){showSymMenu(si,e.clientX,e.clientY);return;}
  const wi=hitWall(cp.x,cp.y,14);
  if(wi>=0&&tool!=='wall'){showWallMenu(wi,e.clientX,e.clientY);return;}
}
function onDCK(e){
  // Double tap to edit wall length
  const p=getXY(e),cp=tC(p.x,p.y);
  const wi=hitWall(cp.x,cp.y,14);
  if(wi>=0){editWallLen(wi);}
}

let _tapTimer=null, _lastTap=0;
function stI(sx,sy){
  closeAllMenus();
  const cp=tC(sx,sy);
  // Hit symbol first
  const si=hitSym(cp.x,cp.y,26);
  if(si>=0){dragSi=si;dragPrev=cp;return;}
  // Hit wall in none/pan mode
  if(tool==='none'||tool==='pan'){
    const wi=hitWall(cp.x,cp.y,14);
    if(wi>=0){dragWi=wi;dragPrev=cp;return;}
    if(tool==='pan'){panS={x:sx,y:sy};panO={x:vx,y:vy};}
  }
  if(tool==='wall'){
    const sn=snapEP(cp.x,cp.y);
    drawS=sn||cp;drawE=drawS;snapEnd=false;return;
  }
  if(tool==='sym'&&selSym){
    const snapped=snapSymToWall(cp.x,cp.y);
    const pos=snapped||{x:cp.x,y:cp.y};
    snap();
    symbols.push({type:selSym,x:pos.x,y:pos.y,rot:snapped?snapped.wallAngle*180/Math.PI:0,label:true,id:Date.now(),onWall:!!snapped});
    updStats();render();return;
  }
}
function mvI(sx,sy){
  const cp=tC(sx,sy);
  if(dragSi!==null){
    const snapped=snapSymToWall(cp.x,cp.y);
    if(snapped){symbols[dragSi].x=snapped.x;symbols[dragSi].y=snapped.y;symbols[dragSi].rot=snapped.wallAngle*180/Math.PI;symbols[dragSi].onWall=true;}
    else{symbols[dragSi].x=cp.x;symbols[dragSi].y=cp.y;symbols[dragSi].onWall=false;}
    dragPrev=cp;render();return;
  }
  if(dragWi!==null&&dragPrev){
    const dx=cp.x-dragPrev.x,dy=cp.y-dragPrev.y;
    walls[dragWi].sx+=dx;walls[dragWi].sy+=dy;walls[dragWi].ex+=dx;walls[dragWi].ey+=dy;
    dragPrev=cp;render();return;
  }
  if(tool==='wall'&&drawS){
    const raw=cp;
    const ax=sAx(drawS.x,drawS.y,raw.x,raw.y);
    const sn=snapEP(ax.x,ax.y);
    drawE=sn||ax;snapEnd=!!sn;render();return;
  }
  if(tool==='pan'&&panS){
    vx=panO.x+(sx-panS.x);vy=panO.y+(sy-panS.y);render();return;
  }
}
function enI(){
  if(dragSi!==null){snap();dragSi=null;dragPrev=null;updStats();return;}
  if(dragWi!==null){snap();dragWi=null;dragPrev=null;return;}
  if(tool==='wall'&&drawS&&drawE){
    const dist=Math.hypot(drawE.x-drawS.x,drawE.y-drawS.y);
    if(dist>10/vs){
      const s={...drawS},e={...drawE};
      showLenDlg('Wandlänge eingeben','',len=>{
        if(len>0){
          const p2=ppm(),d=Math.hypot(e.x-s.x,e.y-s.y);
          const nx=d<.001?1:(e.x-s.x)/d,ny=d<.001?0:(e.y-s.y)/d;
          snap();
          walls.push({sx:s.x,sy:s.y,ex:s.x+nx*len*p2,ey:s.y+ny*len*p2,len,thick:wallThk,color:wallClr,id:Date.now()});
          updStats();render();
        }
      });
    }
    drawS=null;drawE=null;snapEnd=false;render();
  }
  panS=null;
}

// ═══════════════════════════════════════════════════
// ZOOM
// ═══════════════════════════════════════════════════
function zIn(){const ns=Math.min(10,vs*1.3);vx=cv.width/2-(cv.width/2-vx)*ns/vs;vy=cv.height/2-(cv.height/2-vy)*ns/vs;vs=ns;render();}
function zOut(){const ns=Math.max(0.15,vs/1.3);vx=cv.width/2-(cv.width/2-vx)*ns/vs;vy=cv.height/2-(cv.height/2-vy)*ns/vs;vs=ns;render();}
function zReset(){vx=0;vy=0;vs=1;render();}

// ═══════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════
function render(){
  if(!cx)return;
  cx.clearRect(0,0,cv.width,cv.height);
  cx.fillStyle='#EFF3F8';cx.fillRect(0,0,cv.width,cv.height);
  drawGrid();
  walls.forEach((w,i)=>drawWall(w,i===dragWi));
  if(drawS&&drawE)drawWallPreview();
  symbols.forEach((s,i)=>drawSym(s,i===dragSi));
}

function drawGrid(){
  const step=50*vs;
  cx.strokeStyle='rgba(203,213,225,0.5)';cx.lineWidth=0.5;
  cx.beginPath();
  for(let x=vx%step;x<cv.width;x+=step){cx.moveTo(x,0);cx.lineTo(x,cv.height);}
  for(let y=vy%step;y<cv.height;y+=step){cx.moveTo(0,y);cx.lineTo(cv.width,y);}
  cx.stroke();
}

// Draw wall as thick architectural double-line
function drawWall(w,hl){
  const s=tS(w.sx,w.sy),e=tS(w.ex,w.ey);
  const thick=Math.max(3,w.thick*vs);
  const half=thick/2;
  const dx=e.x-s.x,dy=e.y-s.y,len=Math.hypot(dx,dy);
  if(len<1)return;
  const nx=dy/len,ny=-dx/len;

  const o1x=nx*half,o1y=ny*half;
  const wallColor=hl?'#4FC3F7':w.color;

  // Fill (solid wall)
  cx.beginPath();
  cx.moveTo(s.x+o1x,s.y+o1y);cx.lineTo(e.x+o1x,e.y+o1y);
  cx.lineTo(e.x-o1x,e.y-o1y);cx.lineTo(s.x-o1x,s.y-o1y);
  cx.closePath();
  cx.fillStyle=hl?'rgba(79,195,247,0.3)':hexA(w.color,0.9);
  cx.fill();

  // Outer lines
  cx.strokeStyle=hl?'#4FC3F7':w.color;
  cx.lineWidth=Math.max(1,1.5*vs);cx.lineCap='square';
  cx.beginPath();cx.moveTo(s.x+o1x,s.y+o1y);cx.lineTo(e.x+o1x,e.y+o1y);cx.stroke();
  cx.beginPath();cx.moveTo(s.x-o1x,s.y-o1y);cx.lineTo(e.x-o1x,e.y-o1y);cx.stroke();
  // End caps
  cx.beginPath();cx.moveTo(s.x+o1x,s.y+o1y);cx.lineTo(s.x-o1x,s.y-o1y);cx.stroke();
  cx.beginPath();cx.moveTo(e.x+o1x,e.y+o1y);cx.lineTo(e.x-o1x,e.y-o1y);cx.stroke();

  // Length label
  if(w.len){
    const mx=(s.x+e.x)/2,my=(s.y+e.y)/2;
    const fs=Math.max(10,12*vs);
    const lbl=w.len.toFixed(2)+' m';
    cx.font=`bold ${fs}px -apple-system,sans-serif`;
    const tw=cx.measureText(lbl).width;
    const isH=Math.abs(w.ex-w.sx)>Math.abs(w.ey-w.sy);
    const offset=half+4*vs;
    const lx=mx-tw/2,ly=isH?my-offset-2:my-fs/2;
    cx.fillStyle='rgba(255,255,255,0.95)';cx.fillRect(lx-3,ly-fs+2,tw+6,fs+4);
    cx.fillStyle=hl?'#4FC3F7':'#1E3A8A';cx.fillText(lbl,lx,ly);
  }

  // Edit handle (dot at midpoint)
  if(!hl){
    const mx=(s.x+e.x)/2,my=(s.y+e.y)/2;
    cx.fillStyle='rgba(255,255,255,0.8)';
    cx.strokeStyle='#94A3B8';cx.lineWidth=1;
    cx.beginPath();cx.arc(mx,my,Math.max(4,4*vs),0,Math.PI*2);cx.fill();cx.stroke();
  }
}

function drawWallPreview(){
  if(!drawS||!drawE)return;
  const s=tS(drawS.x,drawS.y),e=tS(drawE.x,drawE.y);
  const thick=Math.max(3,wallThk*vs),half=thick/2;
  const dx=e.x-s.x,dy=e.y-s.y,len=Math.hypot(dx,dy);
  if(len<1)return;
  const nx=dy/len,ny=-dx/len;
  cx.beginPath();
  cx.moveTo(s.x+nx*half,s.y+ny*half);cx.lineTo(e.x+nx*half,e.y+ny*half);
  cx.lineTo(e.x-nx*half,e.y-ny*half);cx.lineTo(s.x-nx*half,s.y-ny*half);
  cx.closePath();
  cx.fillStyle='rgba(79,195,247,0.25)';cx.fill();
  cx.strokeStyle='rgba(79,195,247,0.9)';cx.lineWidth=Math.max(1.5,1.8*vs);cx.lineCap='square';
  cx.beginPath();cx.moveTo(s.x+nx*half,s.y+ny*half);cx.lineTo(e.x+nx*half,e.y+ny*half);cx.stroke();
  cx.beginPath();cx.moveTo(s.x-nx*half,s.y-ny*half);cx.lineTo(e.x-nx*half,e.y-ny*half);cx.stroke();
  cx.beginPath();cx.moveTo(s.x+nx*half,s.y+ny*half);cx.lineTo(s.x-nx*half,s.y-ny*half);cx.stroke();
  cx.beginPath();cx.moveTo(e.x+nx*half,e.y+ny*half);cx.lineTo(e.x-nx*half,e.y-ny*half);cx.stroke();
  // Snap dots
  const dr=Math.max(4,6*vs);
  cx.fillStyle='#22C55E';cx.beginPath();cx.arc(s.x,s.y,dr,0,Math.PI*2);cx.fill();
  cx.fillStyle=snapEnd?'#22C55E':'#4FC3F7';cx.beginPath();cx.arc(e.x,e.y,dr,0,Math.PI*2);cx.fill();
  // Live length
  const dist=Math.hypot(drawE.x-drawS.x,drawE.y-drawS.y);
  const estLen=(dist/ppm()).toFixed(2);
  const fs=Math.max(11,13*vs);
  cx.font=`bold ${fs}px -apple-system,sans-serif`;
  const lbl=`~${estLen} m`;
  const tw=cx.measureText(lbl).width;
  const mx=(s.x+e.x)/2,my=(s.y+e.y)/2;
  cx.fillStyle='rgba(15,22,35,0.85)';cx.fillRect(mx-tw/2-6,my-fs-4,tw+12,fs+8);
  cx.fillStyle='#4FC3F7';cx.fillText(lbl,mx-tw/2,my-2);
}

function drawSym(sym,drag){
  const p=tS(sym.x,sym.y);
  const r=Math.max(12,16*vs);
  const clr=drag?'#4FC3F7':SD[sym.type]?.c||'#22C55E';

  cx.save();
  cx.translate(p.x,p.y);cx.rotate(sym.rot*Math.PI/180);cx.translate(-p.x,-p.y);

  // White circle bg
  cx.fillStyle='#fff';cx.beginPath();cx.arc(p.x,p.y,r,0,Math.PI*2);cx.fill();
  cx.strokeStyle=drag?'#4FC3F7':clr;cx.lineWidth=Math.max(1.5,1.8*vs);
  cx.beginPath();cx.arc(p.x,p.y,r,0,Math.PI*2);cx.stroke();

  // Draw icon (PNG or SVG fallback)
  const img=getImg(sym.type);
  if(img&&img.complete&&img.naturalWidth>0){
    const sz=r*1.3;
    cx.drawImage(img,p.x-sz,p.y-sz,sz*2,sz*2);
  } else {
    drawIconSVG(sym.type,p.x,p.y,r*0.52,clr);
  }
  cx.restore();

  // Label
  if(sym.label){
    const fs=Math.max(8,9*vs);
    const lbl=SD[sym.type]?.l||sym.type;
    cx.font=`600 ${fs}px -apple-system,sans-serif`;
    const tw=cx.measureText(lbl).width;
    cx.fillStyle='rgba(255,255,255,0.9)';cx.fillRect(p.x-tw/2-2,p.y+r+1,tw+4,fs+3);
    cx.fillStyle=clr;cx.fillText(lbl,p.x-tw/2,p.y+r+fs+1);
  }

  // "On wall" indicator
  if(sym.onWall){
    cx.fillStyle=clr;cx.beginPath();cx.arc(p.x,p.y-r-3,2.5,0,Math.PI*2);cx.fill();
  }
}

// Full SVG-based icon fallbacks for all symbols
function drawIconSVG(type,cx2,cy2,r,clr){
  cx.strokeStyle=clr;cx.lineWidth=Math.max(1.2,1.5*vs);cx.lineCap='round';cx.lineJoin='round';cx.fillStyle=clr;
  const PI=Math.PI;
  switch(type){
    case 'steckdose':case 'steckdose2':case 'steckdose3':
      cx.beginPath();cx.arc(cx2,cy2,r,0,PI*2);cx.stroke();
      cx.beginPath();cx.moveTo(cx2-r*.35,cy2-r*.5);cx.lineTo(cx2-r*.35,cy2+r*.35);cx.stroke();
      cx.beginPath();cx.moveTo(cx2+r*.35,cy2-r*.5);cx.lineTo(cx2+r*.35,cy2+r*.35);cx.stroke();
      cx.beginPath();cx.arc(cx2,cy2+r*.35,r*.28,0,PI);cx.stroke();
      if(type==='steckdose2'){cx.beginPath();cx.moveTo(cx2-r*.6,cy2+r*.7);cx.lineTo(cx2+r*.6,cy2+r*.7);cx.stroke();}
      break;
    case 'schalter':
      cx.beginPath();cx.arc(cx2,cy2+r*.15,r*.7,0,PI*2);cx.stroke();
      cx.beginPath();cx.moveTo(cx2,cy2-r*.55);cx.lineTo(cx2+r*1.1,cy2-r*1.4);cx.stroke();
      cx.beginPath();cx.arc(cx2+r*1.1,cy2-r*1.4,r*.22,0,PI*2);cx.fill();
      break;
    case 'wechsel':
      cx.beginPath();cx.arc(cx2,cy2+r*.15,r*.7,0,PI*2);cx.stroke();
      cx.beginPath();cx.moveTo(cx2,cy2-r*.55);cx.lineTo(cx2+r*1.1,cy2-r*1.4);cx.stroke();
      cx.beginPath();cx.arc(cx2+r*1.1,cy2-r*1.4,r*.22,0,PI*2);cx.fill();
      cx.setLineDash([r*.22,r*.14]);
      cx.beginPath();cx.moveTo(cx2,cy2-r*.55);cx.lineTo(cx2+r*.85,cy2-r*.55);cx.stroke();
      cx.setLineDash([]);
      cx.beginPath();cx.arc(cx2+r*.85,cy2-r*.55,r*.2,0,PI*2);cx.fill();
      break;
    case 'kreuz':
      cx.beginPath();cx.arc(cx2,cy2+r*.15,r*.7,0,PI*2);cx.stroke();
      cx.beginPath();cx.moveTo(cx2,cy2-r*.55);cx.lineTo(cx2+r*1.1,cy2-r*1.4);cx.stroke();
      cx.beginPath();cx.arc(cx2+r*1.1,cy2-r*1.4,r*.22,0,PI*2);cx.fill();
      const ax=cx2+r*.55,ay=cy2-r*.97;
      cx.beginPath();cx.moveTo(ax-r*.18,ay-r*.18);cx.lineTo(ax+r*.18,ay+r*.18);cx.stroke();
      cx.beginPath();cx.moveTo(ax+r*.18,ay-r*.18);cx.lineTo(ax-r*.18,ay+r*.18);cx.stroke();
      break;
    case 'taster':
      cx.beginPath();cx.arc(cx2,cy2,r,0,PI*2);cx.stroke();
      cx.beginPath();cx.arc(cx2,cy2,r*.42,0,PI*2);cx.stroke();
      break;
    case 'taster_l':
      cx.beginPath();cx.arc(cx2,cy2,r*.7,0,PI*2);cx.stroke();
      cx.beginPath();cx.arc(cx2,cy2,r*.3,0,PI*2);cx.fill();
      cx.beginPath();cx.moveTo(cx2,cy2-r*.7);cx.lineTo(cx2+r,cy2-r*1.3);cx.stroke();
      cx.beginPath();cx.arc(cx2+r,cy2-r*1.3,r*.2,0,PI*2);cx.fill();
      break;
    case 'verteiler':
      cx.strokeRect(cx2-r*.8,cy2-r*.8,r*1.6,r*1.6);
      cx.beginPath();cx.moveTo(cx2-r*.55,cy2-r*.55);cx.lineTo(cx2+r*.55,cy2+r*.55);cx.stroke();
      cx.beginPath();cx.moveTo(cx2+r*.55,cy2-r*.55);cx.lineTo(cx2-r*.55,cy2+r*.55);cx.stroke();
      break;
    case 'sicherung':
      cx.strokeRect(cx2-r*.9,cy2-r*.65,r*1.8,r*1.3);
      for(let i=-1;i<=1;i++){cx.beginPath();cx.moveTo(cx2-r*.65,cy2+i*r*.22);cx.lineTo(cx2+r*.65,cy2+i*r*.22);cx.stroke();}
      break;
    case 'data':case 'netzwerk':
      cx.beginPath();cx.moveTo(cx2,cy2-r*.9);cx.lineTo(cx2,cy2+r*.15);cx.stroke();
      cx.beginPath();cx.moveTo(cx2-r*.8,cy2+r*.15);cx.lineTo(cx2+r*.8,cy2+r*.15);cx.stroke();
      cx.beginPath();cx.moveTo(cx2-r*.8,cy2+r*.65);cx.lineTo(cx2+r*.8,cy2+r*.65);cx.stroke();
      if(type==='netzwerk'){cx.beginPath();cx.arc(cx2,cy2-r*.9,r*.18,0,PI*2);cx.fill();}
      break;
    case 'antenne':
      cx.beginPath();cx.moveTo(cx2,cy2-r*.9);cx.lineTo(cx2,cy2+r*.3);cx.stroke();
      cx.beginPath();cx.moveTo(cx2-r*.6,cy2+r*.3);cx.lineTo(cx2+r*.6,cy2+r*.3);cx.stroke();
      cx.beginPath();cx.moveTo(cx2-r*.4,cy2+r*.6);cx.lineTo(cx2+r*.4,cy2+r*.6);cx.stroke();
      cx.beginPath();cx.arc(cx2,cy2-r*.9,r*.18,0,PI*2);cx.fill();
      break;
    case 'telefon':
      cx.beginPath();cx.arc(cx2-r*.35,cy2,r*.35,0,PI*2);cx.stroke();
      cx.beginPath();cx.arc(cx2+r*.35,cy2,r*.35,0,PI*2);cx.stroke();
      cx.beginPath();cx.moveTo(cx2-r*.35,cy2+r*.35);cx.lineTo(cx2+r*.35,cy2+r*.35);cx.stroke();
      break;
    case 'licht':
      cx.beginPath();cx.arc(cx2,cy2,r*.4,0,PI*2);cx.stroke();
      for(let i=0;i<8;i++){const a=i*PI/4;cx.beginPath();cx.moveTo(cx2+r*.55*Math.cos(a),cy2+r*.55*Math.sin(a));cx.lineTo(cx2+r*.95*Math.cos(a),cy2+r*.95*Math.sin(a));cx.stroke();}
      break;
    case 'leuchte':
      cx.beginPath();cx.arc(cx2,cy2,r*.88,0,PI*2);cx.stroke();
      cx.beginPath();cx.moveTo(cx2-r*.6,cy2-r*.6);cx.lineTo(cx2+r*.6,cy2+r*.6);cx.stroke();
      cx.beginPath();cx.moveTo(cx2+r*.6,cy2-r*.6);cx.lineTo(cx2-r*.6,cy2+r*.6);cx.stroke();
      break;
    case 'spot':case 'aussen':
      cx.beginPath();cx.arc(cx2,cy2,r*.88,0,PI*2);cx.stroke();
      cx.globalAlpha=0.4;cx.beginPath();cx.arc(cx2,cy2,r*.38,0,PI*2);cx.fill();cx.globalAlpha=1;
      cx.beginPath();cx.arc(cx2,cy2,r*.38,0,PI*2);cx.stroke();
      if(type==='aussen'){cx.beginPath();cx.moveTo(cx2,cy2-r*.88);cx.lineTo(cx2,cy2-r*1.3);cx.stroke();}
      break;
  }
}

function hexA(hex,a){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return`rgba(${r},${g},${b},${a})`;
}

// STATS
// ═══════════════════════════════════════════════════
function updStats(){
  const wEl=document.getElementById('cwalls'),sEl=document.getElementById('celems');
  if(wEl)wEl.textContent=walls.length+' Wände';
  if(sEl)sEl.textContent=symbols.length+' Elemente';
  let tot=0;walls.forEach(w=>tot+=(w.len||0));
  const td=document.getElementById('stotal');
  if(td){
    if(tot>0){td.style.display='flex';const t=document.getElementById('stotalT');if(t)t.textContent='Gesamt: '+tot.toFixed(1)+' m';}
    else td.style.display='none';
  }
  const counts={};symbols.forEach(s=>counts[s.type]=(counts[s.type]||0)+1);
  const sc=document.getElementById('schips');
  if(!sc)return;sc.innerHTML='';
  Object.entries(counts).forEach(([t,n])=>{
    const c=SD[t]?.c||'#22C55E';
    const chip=document.createElement('div');chip.className='sc';
    chip.style=`background:${c}20;border:1px solid ${c}50;color:${c}`;
    chip.innerHTML=`<div style="width:7px;height:7px;border-radius:50%;background:${c};flex-shrink:0"></div>${SD[t]?.s||t}: ${n}`;
    sc.appendChild(chip);
  });
}

function showSymMenu(i,x,y){
  const m=document.getElementById('cm'),s=symbols[i];
  m.innerHTML=`
    <button class="ci" onclick="rotS(${i});closeAllMenus()">↻ Drehen 90°</button>

    <div class="csep"></div>

function showWallMenu(i,x,y){
  const m=document.getElementById('cm');
  m.innerHTML=`
    <button class="ci" onclick="editWallLen(${i});closeAllMenus()">📏 Länge ändern</button>
    <button class="ci" onclick="setWT(${i},4);closeAllMenus()">— Dünn (4)</button>

function posMenu(m,x,y){
  m.classList.add('s');
  const mw=Math.max(m.offsetWidth,190),mh=Math.max(m.offsetHeight,160);
  m.style.left=Math.min(x,window.innerWidth-mw-8)+'px';
  m.style.top=Math.min(y,window.innerHeight-mh-8)+'px';
}
function closeAllMenus(){
  document.getElementById('cm')?.classList.remove('s');
  document.getElementById('dd')?.classList.remove('s');
}
document.addEventListener('click',e=>{
  if(!e.target.closest('#cm'))document.getElementById('cm')?.classList.remove('s');
  if(!e.target.closest('#dd')&&!e.target.closest('#menu-btn'))document.getElementById('dd')?.classList.remove('s');
});

// Actions
function rotS(i){snap();symbols[i].rot=(symbols[i].rot+90)%360;render();}
function dupS(i){snap();symbols.push({...symbols[i],x:symbols[i].x+30,y:symbols[i].y+30,id:Date.now()});updStats();render();}
function togL(i){snap();symbols[i].label=!symbols[i].label;render();}
function delS(i){snap();symbols.splice(i,1);updStats();render();}
function editWallLen(i){
  const w=walls[i];
  showLenDlg('Länge ändern',w.len||'',len=>{
    if(len>0){
      snap();
      const d=Math.hypot(w.ex-w.sx,w.ey-w.sy);
      const nx=d<.001?1:(w.ex-w.sx)/d,ny=d<.001?0:(w.ey-w.sy)/d;
      const p2=ppm();
      walls[i].ex=w.sx+nx*len*p2;walls[i].ey=w.sy+ny*len*p2;walls[i].len=len;
      updStats();render();
    }
  });
}
function setWT(i,t){snap();walls[i].thick=t;render();}
function delW(i){snap();walls.splice(i,1);updStats();render();}

// ═══════════════════════════════════════════════════
// PDF EXPORT
// ═══════════════════════════════════════════════════
function exportPDF(){
  closeAllMenus();
  // Save current viewport
  const svx=vx,svy=vy,svs=vs;

  // Calculate bounds of all content
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  for(const w of walls){
    minX=Math.min(minX,w.sx,w.ex);minY=Math.min(minY,w.sy,w.ey);
    maxX=Math.max(maxX,w.sx,w.ex);maxY=Math.max(maxY,w.sy,w.ey);
  }
  for(const s of symbols){
    minX=Math.min(minX,s.x-20);minY=Math.min(minY,s.y-20);
    maxX=Math.max(maxX,s.x+20);maxY=Math.max(maxY,s.y+20);
  }
  if(minX===Infinity){toast('Keine Elemente zum Exportieren');return;}

  const margin=60;
  const contentW=maxX-minX,contentH=maxY-minY;
  const A4w=794,A4h=1123; // A4 at 96dpi
  const scaleX=(A4w-margin*2)/contentW,scaleY=(A4h-margin*2)/contentH;
  const exportScale=Math.min(scaleX,scaleY,3);

  // Resize canvas temporarily
  const oldW=cv.width,oldH=cv.height;
  cv.width=A4w;cv.height=A4h;
  vx=margin-minX*exportScale;
  vy=margin-minY*exportScale;
  vs=exportScale;

  // White background
  cx.fillStyle='#ffffff';cx.fillRect(0,0,A4w,A4h);

  // Draw title
  cx.fillStyle='#1E293B';cx.font='bold 20px -apple-system,sans-serif';
  cx.fillText(pn, margin, 35);
  cx.font='12px -apple-system,sans-serif';cx.fillStyle='#64748B';
  cx.fillText(new Date().toLocaleDateString('de-DE'), margin, 52);

  // Draw content
  walls.forEach(w=>drawWall(w,false));
  symbols.forEach(s=>drawSym(s,false));

  // Border
  cx.strokeStyle='#CBD5E1';cx.lineWidth=1;
  cx.strokeRect(10,10,A4w-20,A4h-20);

  // Export as PNG (print dialog)
  const dataUrl=cv.toDataURL('image/png',1.0);

  // Restore
  cv.width=oldW;cv.height=oldH;vx=svx;vy=svy;vs=svs;render();

  // Open in new tab for printing/saving as PDF
  const win=window.open('','_blank');
  win.document.write(`<!DOCTYPE html><html><head><title>${pn}</title>
  <style>*{margin:0;padding:0;}body{background:#fff;}img{width:100%;display:block;}
  @media print{@page{size:A4;margin:0;}}</style></head>
  <body><img src="${dataUrl}"><script>setTimeout(()=>window.print(),500);<\/script></body></html>`);
  win.document.close();
  toast('📄 PDF wird geöffnet...');
}

// ═══════════════════════════════════════════════════
// PROJECT MANAGEMENT
// ═══════════════════════════════════════════════════
function toggleDD(){document.getElementById('dd')?.classList.toggle('s');}

function newProj(){
  closeAllMenus();
  showConf('Neues Projekt','Aktuelles Projekt verwerfen?',()=>{
    walls=[];symbols=[];US=[];RS=[];pn='Neues Projekt';
    document.getElementById('plbl').textContent=pn;
    updUR();updStats();render();
  });
}
function saveProj(){
  closeAllMenus();
  const data={name:pn,walls,symbols,v:2};
  const all=loadAll();const idx=all.findIndex(p=>p.name===pn);
  if(idx>=0)all[idx]=data;else all.push(data);
  try{localStorage.setItem('ep2',JSON.stringify(all));toast('✅ "'+pn+'" gespeichert');}
  catch(e){toast('❌ Fehler beim Speichern');}
}
function openProj(){
  closeAllMenus();const all=loadAll();
  if(!all.length){toast('Keine gespeicherten Projekte');return;}
  const list=document.getElementById('dopenL');list.innerHTML='';
  all.forEach(p=>{
    const btn=document.createElement('button');
    btn.style='width:100%;text-align:left;padding:12px 14px;background:none;border:none;color:#fff;cursor:pointer;border-radius:8px;transition:background .1s;';
    btn.innerHTML=`<div style="font-weight:600;font-size:14px">${p.name}</div><div style="font-size:11px;color:#6B7280;margin-top:2px">${(p.walls||[]).length} Wände · ${(p.symbols||[]).length} Elemente</div>`;
    btn.onmouseover=()=>btn.style.background='rgba(255,255,255,.06)';
    btn.onmouseout=()=>btn.style.background='none';
    btn.onclick=()=>{
      walls=p.walls||[];symbols=p.symbols||[];pn=p.name;
      document.getElementById('plbl').textContent=pn;
      US=[];RS=[];updUR();updStats();render();cDlg('dopen');
    };
    list.appendChild(btn);
  });
  document.getElementById('dopen').classList.add('s');
}
function renameProj(){closeAllMenus();showNDlg('Umbenennen',pn,name=>{if(name){pn=name;document.getElementById('plbl').textContent=name;}});}
function dupProj(){
  closeAllMenus();
  const nn=pn+' (Kopie)';
  const all=loadAll();
  all.push({name:nn,walls:J(walls),symbols:J(symbols),v:2});
  localStorage.setItem('ep2',JSON.stringify(all));
  toast('✅ Dupliziert als "'+nn+'"');
}
function loadAll(){try{return JSON.parse(localStorage.getItem('ep2')||'[]');}catch{return[];}}
function confirmClear(){closeAllMenus();showConf('Alles löschen?','Alle Wände und Elemente werden gelöscht.',()=>{snap();walls=[];symbols=[];updStats();render();});}

function toast(msg){
  let t=document.getElementById('toast');
  if(!t){t=document.createElement('div');t.id='toast';
    t.style='position:fixed;bottom:60px;left:50%;transform:translateX(-50%);background:#059669;color:#fff;padding:10px 22px;border-radius:20px;font-size:13px;z-index:9999;pointer-events:none;transition:opacity .3s;white-space:nowrap;';
    document.body.appendChild(t);}
  t.textContent=msg;t.style.opacity='1';
  clearTimeout(t._t);t._t=setTimeout(()=>t.style.opacity='0',2800);
}
