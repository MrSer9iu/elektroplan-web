<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ElektroPlan">
<meta name="theme-color" content="#0F1623">
<title>ElektroPlan</title>
<style>
:root{--bg:#0F1623;--sidebar:#1A1F2E;--border:#2D3448;--text:#F9FAFB;--muted:#6B7280;--blue:#4FC3F7;--amber:#FFB74D;--green:#22C55E;--red:#EF5350;--wall:#1F2937;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:-apple-system,sans-serif;}
#app{display:flex;flex-direction:column;height:100%;}
#topbar{height:50px;background:#0A0F1A;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 10px;gap:6px;flex-shrink:0;z-index:100;overflow-x:auto;}
#menu-btn{display:flex;align-items:center;gap:5px;padding:6px 10px;background:linear-gradient(135deg,#4FC3F7,#0288D1);border-radius:8px;border:none;color:#fff;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0;}
#status-dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex-shrink:0;}
#status-text{font-size:12px;color:var(--muted);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:100px;}
.tb-btn{width:32px;height:32px;background:#1A2035;border:none;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);flex-shrink:0;}
.tb-btn:disabled{opacity:.35;cursor:default;}
.tb-btn svg{width:16px;height:16px;}
.tb-sep{width:1px;height:28px;background:var(--border);flex-shrink:0;}
.tb-chip{display:flex;align-items:center;gap:4px;padding:4px 8px;background:#1A2035;border-radius:20px;font-size:10px;color:var(--muted);white-space:nowrap;flex-shrink:0;}
#main{display:flex;flex:1;overflow:hidden;}
#sidebar{width:82px;background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:6px 0;overflow-y:auto;flex-shrink:0;gap:1px;}
.s-div{width:58px;height:1px;background:var(--border);margin:4px 0;}
.s-label{font-size:8px;color:var(--muted);letter-spacing:.8px;text-transform:uppercase;}
.tool-btn{width:70px;padding:7px 3px;border-radius:10px;border:none;background:transparent;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:8.5px;transition:all .15s;line-height:1.2;text-align:center;}
.tool-btn svg{width:24px;height:24px;}
.tool-btn.active{background:rgba(79,195,247,.15);color:var(--blue);border:1px solid rgba(79,195,247,.4);}
.tool-btn.active-red{background:rgba(239,83,80,.12);color:#EF5350;border:1px solid rgba(239,83,80,.35);}
.tool-btn.active-green2{background:rgba(34,197,94,.12);color:#22C55E;border:1px solid rgba(34,197,94,.35);}
.tool-btn.pan-active{background:rgba(52,211,153,.12);color:#34D399;border:1px solid rgba(52,211,153,.35);}
.thick-row{display:flex;gap:4px;padding:2px;}
.thick-btn{width:20px;height:20px;border-radius:4px;border:none;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.thick-btn.active{background:rgba(79,195,247,.15);border:1px solid rgba(79,195,247,.4);}
.thick-line{background:var(--muted);border-radius:1px;width:14px;}
.thick-btn.active .thick-line{background:var(--blue);}
.color-row{display:flex;flex-wrap:wrap;gap:4px;padding:3px 8px;justify-content:center;}
.color-dot{width:16px;height:16px;border-radius:50%;cursor:pointer;border:2px solid transparent;}
.color-dot.active{border-color:#fff;}
#canvas-wrap{flex:1;position:relative;overflow:hidden;background:#F0F4F8;}
#canvas{position:absolute;top:0;left:0;touch-action:none;}
#ctx-menu{position:fixed;background:#1E2436;border-radius:12px;padding:6px 0;box-shadow:0 8px 32px rgba(0,0,0,.5);z-index:999;min-width:190px;display:none;border:1px solid var(--border);}
#ctx-menu.show{display:block;}
.ctx-item{display:flex;align-items:center;gap:10px;padding:10px 16px;font-size:13px;color:#fff;cursor:pointer;border:none;background:none;width:100%;}
.ctx-item:active{background:rgba(255,255,255,.07);}
.ctx-item.danger{color:var(--red);}
.ctx-item svg{width:17px;height:17px;flex-shrink:0;}
.ctx-sep{height:1px;background:var(--border);margin:4px 0;}
#statsbar{height:46px;background:#0A0F1A;border-top:1px solid var(--border);display:flex;align-items:center;padding:0 14px;gap:8px;overflow-x:auto;flex-shrink:0;}
.stat-chip{display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;flex-shrink:0;}
.stat-dot{width:7px;height:7px;border-radius:50%;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1000;display:none;align-items:center;justify-content:center;}
.overlay.show{display:flex;}
.dialog{background:#1E2436;border-radius:16px;padding:24px;min-width:300px;max-width:420px;width:92%;border:1px solid var(--border);}
.dialog h3{color:#fff;font-size:18px;margin-bottom:14px;}
.dialog p{color:var(--muted);font-size:14px;margin-bottom:14px;}
.dialog label{color:var(--muted);font-size:13px;display:block;margin-bottom:8px;}
.dialog input{width:100%;background:#111827;border:1px solid #374151;border-radius:10px;padding:12px;color:#fff;font-size:22px;text-align:center;outline:none;}
.dialog input[type=text]{font-size:16px;text-align:left;}
.dialog input:focus{border-color:var(--blue);}
.dialog-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;}
.btn-cancel{background:none;border:none;color:var(--muted);padding:8px 14px;border-radius:8px;cursor:pointer;font-size:13px;}
.btn-ok{background:var(--blue);border:none;color:#000;padding:8px 18px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:700;}
.btn-danger{background:var(--red);border:none;color:#fff;padding:8px 18px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:700;}
#dropdown{position:fixed;background:#1E2436;border-radius:12px;padding:6px 0;box-shadow:0 8px 32px rgba(0,0,0,.6);z-index:999;min-width:200px;display:none;border:1px solid var(--border);top:54px;left:10px;}
#dropdown.show{display:block;}
.dd-item{display:flex;align-items:center;gap:10px;padding:11px 16px;font-size:13px;color:#fff;cursor:pointer;border:none;background:none;width:100%;}
.dd-item:active{background:rgba(255,255,255,.05);}
.dd-item.danger{color:var(--red);}
.dd-item svg{width:16px;height:16px;flex-shrink:0;}
.dd-sep{height:1px;background:var(--border);margin:4px 0;}
</style>
</head>
<body>
<div id="app">
<div id="topbar">
  <button id="menu-btn" onclick="toggleDropdown()">
    <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><path d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
    <span id="proj-label">Neues Projekt</span>
    <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><path d="M7 10l5 5 5-5z"/></svg>
  </button>
  <div id="status-dot"></div>
  <span id="status-text">← Werkzeug wählen</span>
  <div class="tb-sep"></div>
  <button class="tb-btn" id="btn-undo" onclick="undo()" disabled title="Rückgängig">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7v6h6"/><path d="M3 13A9 9 0 1 0 6 6.3L3 9"/></svg>
  </button>
  <button class="tb-btn" id="btn-redo" onclick="redo()" disabled title="Wiederholen">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 7v6h-6"/><path d="M21 13A9 9 0 1 1 18 6.3L21 9"/></svg>
  </button>
  <div class="tb-sep"></div>
  <button class="tb-btn" onclick="zoomIn()" title="Zoom +">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
  </button>
  <button class="tb-btn" onclick="zoomOut()" title="Zoom -">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
  </button>
  <button class="tb-btn" onclick="resetView()" title="Reset">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h6v6M14 10l6.1-6.1M9 21H3v-6M10 14l-6.1 6.1"/></svg>
  </button>
  <div class="tb-sep"></div>
  <div class="tb-chip"><span id="chip-walls">0 Wände</span></div>
  <div class="tb-chip"><span id="chip-elems">0 Elemente</span></div>
</div>

<div id="main">
<div id="sidebar">
  <!-- Tools -->
  <button class="tool-btn" id="tool-wall" onclick="setTool('wall')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>Wand
  </button>
  <button class="tool-btn" id="tool-pan" onclick="setTool('pan')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 11V6a2 2 0 00-2-2v0a2 2 0 00-2 2v0"/><path d="M14 10V4a2 2 0 00-2-2v0a2 2 0 00-2 2v2"/><path d="M10 10.5V6a2 2 0 00-2-2v0a2 2 0 00-2 2v8"/><path d="M18 11a2 2 0 114 0v3a8 8 0 01-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 012.83-2.82L7 15"/></svg>Bewegen
  </button>
  <div class="s-div"></div>
  <span class="s-label">Wand</span>
  <div class="thick-row">
    <button class="thick-btn" id="thick-thin" onclick="setThick(2)"><div class="thick-line" style="height:2px"></div></button>
    <button class="thick-btn active" id="thick-norm" onclick="setThick(5)"><div class="thick-line" style="height:4px"></div></button>
    <button class="thick-btn" id="thick-bold" onclick="setThick(10)"><div class="thick-line" style="height:8px"></div></button>
  </div>
  <div class="color-row">
    <div class="color-dot active" style="background:#1F2937" onclick="setWallColor('#1F2937',this)"></div>
    <div class="color-dot" style="background:#1D4ED8" onclick="setWallColor('#1D4ED8',this)"></div>
    <div class="color-dot" style="background:#059669" onclick="setWallColor('#059669',this)"></div>
    <div class="color-dot" style="background:#DC2626" onclick="setWallColor('#DC2626',this)"></div>
    <div class="color-dot" style="background:#7C3AED" onclick="setWallColor('#7C3AED',this)"></div>
    <div class="color-dot" style="background:#78716C" onclick="setWallColor('#78716C',this)"></div>
  </div>
  <div class="s-div"></div>
  <!-- GREEN symbols -->
  <span class="s-label" style="color:#22C55E">🟢 230V</span>
  <button class="tool-btn" id="sym-steckdose" onclick="setSym('steckdose')">
    <svg viewBox="0 0 32 32" width="28" height="28" fill="none" stroke="#22C55E" stroke-width="1.8" stroke-linecap="round"><circle cx="16" cy="16" r="9"/><line x1="12" y1="11" x2="12" y2="21"/><line x1="20" y1="11" x2="20" y2="21"/></svg>Steckdose
  </button>
  <button class="tool-btn" id="sym-steckdose2" onclick="setSym('steckdose2')">
    <svg viewBox="0 0 32 32" width="28" height="28" fill="none" stroke="#22C55E" stroke-width="1.8" stroke-linecap="round"><circle cx="16" cy="16" r="9"/><line x1="11" y1="11" x2="11" y2="21"/><line x1="16" y1="11" x2="16" y2="21"/><line x1="21" y1="11" x2="21" y2="21"/></svg>Steckdose 2f
  </button>
  <button class="tool-btn" id="sym-schalter" onclick="setSym('schalter')">
    <svg viewBox="0 0 32 32" width="28" height="28" fill="none" stroke="#22C55E" stroke-width="1.8" stroke-linecap="round"><circle cx="13" cy="18" r="6"/><line x1="13" y1="12" x2="22" y2="6"/><circle cx="22" cy="6" r="2" fill="#22C55E" stroke="none"/></svg>Ausschalter
  </button>
  <button class="tool-btn" id="sym-wechsel" onclick="setSym('wechsel')">
    <svg viewBox="0 0 32 32" width="28" height="28" fill="none" stroke="#22C55E" stroke-width="1.8" stroke-linecap="round"><circle cx="10" cy="18" r="5"/><circle cx="22" cy="18" r="5"/><line x1="13" y1="14" x2="19" y2="10"/></svg>Wechsel­schalter
  </button>
  <button class="tool-btn" id="sym-kreuz" onclick="setSym('kreuz')">
    <svg viewBox="0 0 32 32" width="28" height="28" fill="none" stroke="#22C55E" stroke-width="1.8" stroke-linecap="round"><circle cx="16" cy="16" r="9"/><line x1="10" y1="10" x2="22" y2="22"/><line x1="22" y1="10" x2="10" y2="22"/></svg>Kreuz­schalter
  </button>
  <button class="tool-btn" id="sym-taster" onclick="setSym('taster')">
    <svg viewBox="0 0 32 32" width="28" height="28" fill="none" stroke="#22C55E" stroke-width="1.8" stroke-linecap="round"><circle cx="16" cy="16" r="9"/><circle cx="16" cy="16" r="4"/></svg>Taster
  </button>
  <button class="tool-btn" id="sym-verteiler" onclick="setSym('verteiler')">
    <svg viewBox="0 0 32 32" width="28" height="28" fill="none" stroke="#22C55E" stroke-width="1.8" stroke-linecap="round"><rect x="5" y="5" width="22" height="22" rx="1"/><line x1="10" y1="10" x2="22" y2="22"/><line x1="22" y1="10" x2="10" y2="22"/></svg>Verteiler­dose
  </button>
  <button class="tool-btn" id="sym-sicherung" onclick="setSym('sicherung')">
    <svg viewBox="0 0 32 32" width="28" height="28" fill="none" stroke="#22C55E" stroke-width="1.8" stroke-linecap="round"><rect x="4" y="8" width="24" height="16" rx="1"/><line x1="8" y1="13" x2="24" y2="13"/><line x1="8" y1="19" x2="24" y2="19"/></svg>Sicherungs­kasten
  </button>
  <button class="tool-btn" id="sym-data" onclick="setSym('data')">
    <svg viewBox="0 0 32 32" width="28" height="28" fill="none" stroke="#22C55E" stroke-width="1.8" stroke-linecap="round"><line x1="16" y1="6" x2="16" y2="16"/><line x1="10" y1="16" x2="22" y2="16"/><line x1="10" y1="22" x2="22" y2="22"/></svg>Datensteck­dose
  </button>
  <div class="s-div"></div>
  <!-- RED symbols -->
  <span class="s-label" style="color:#EF5350">🔴 Licht</span>
  <button class="tool-btn" id="sym-licht" onclick="setSym('licht')">
    <svg viewBox="0 0 32 32" width="28" height="28" fill="none" stroke="#EF5350" stroke-width="1.8" stroke-linecap="round"><circle cx="16" cy="16" r="5"/><line x1="16" y1="4" x2="16" y2="8"/><line x1="16" y1="24" x2="16" y2="28"/><line x1="4" y1="16" x2="8" y2="16"/><line x1="24" y1="16" x2="28" y2="16"/><line x1="7.5" y1="7.5" x2="10.3" y2="10.3"/><line x1="21.7" y1="21.7" x2="24.5" y2="24.5"/><line x1="7.5" y1="24.5" x2="10.3" y2="21.7"/><line x1="21.7" y1="10.3" x2="24.5" y2="7.5"/></svg>Lichtpunkt
  </button>
  <button class="tool-btn" id="sym-leuchte" onclick="setSym('leuchte')">
    <svg viewBox="0 0 32 32" width="28" height="28" fill="none" stroke="#EF5350" stroke-width="1.8" stroke-linecap="round"><circle cx="16" cy="16" r="9"/><line x1="10" y1="10" x2="22" y2="22"/><line x1="22" y1="10" x2="10" y2="22"/><circle cx="16" cy="16" r="3" stroke="#EF5350"/></svg>Leuchte (X)
  </button>
  <button class="tool-btn" id="sym-spot" onclick="setSym('spot')">
    <svg viewBox="0 0 32 32" width="28" height="28" fill="none" stroke="#EF5350" stroke-width="1.8" stroke-linecap="round"><circle cx="16" cy="16" r="9"/><circle cx="16" cy="16" r="4" fill="#EF5350" opacity=".3"/><line x1="16" y1="4" x2="16" y2="8"/><line x1="24" y1="16" x2="28" y2="16"/></svg>Spot / Einbau
  </button>
  <div class="s-div"></div>
  <button class="tool-btn" style="color:var(--red)" onclick="confirmClear()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>Löschen
  </button>
</div>

<div id="canvas-wrap">
  <canvas id="canvas"></canvas>
</div>
</div>

<div id="statsbar">
  <span style="font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.8px;white-space:nowrap;">STATISTIK:</span>
  <div id="stats-total" class="stat-chip" style="display:none;background:rgba(79,195,247,.1);border:1px solid rgba(79,195,247,.3);color:#4FC3F7;">
    <span id="stats-total-text"></span>
  </div>
  <div id="stats-chips" style="display:flex;gap:6px;flex-wrap:nowrap;"></div>
</div>
</div>

<!-- DROPDOWN -->
<div id="dropdown">
  <button class="dd-item" onclick="newProject()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>Neues Projekt</button>
  <button class="dd-item" onclick="saveProject()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>Speichern</button>
  <button class="dd-item" onclick="openProject()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>Öffnen</button>
  <button class="dd-item" onclick="renameProject()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>Umbenennen</button>
  <button class="dd-item" onclick="duplicateProject()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>Duplizieren</button>
  <div class="dd-sep"></div>
  <button class="dd-item danger" onclick="confirmClear()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/></svg>Alles löschen</button>
</div>

<!-- CTX MENU -->
<div id="ctx-menu"></div>

<!-- LENGTH DLG -->
<div class="overlay" id="dlg-len">
  <div class="dialog">
    <h3 id="dlg-len-title">Wandlänge</h3>
    <label>Länge in Metern:</label>
    <input type="number" id="dlg-len-inp" step="0.01" min="0.01" placeholder="z.B. 3.45">
    <div class="dialog-btns">
      <button class="btn-cancel" onclick="closeDlg('dlg-len')">Abbrechen</button>
      <button class="btn-ok" onclick="confirmLen()">OK</button>
    </div>
  </div>
</div>

<!-- CONFIRM DLG -->
<div class="overlay" id="dlg-confirm">
  <div class="dialog">
    <h3 id="dlg-confirm-title">Bestätigen</h3>
    <p id="dlg-confirm-text"></p>
    <div class="dialog-btns">
      <button class="btn-cancel" onclick="closeDlg('dlg-confirm')">Abbrechen</button>
      <button class="btn-danger" id="dlg-confirm-ok">OK</button>
    </div>
  </div>
</div>

<!-- NAME DLG -->
<div class="overlay" id="dlg-name">
  <div class="dialog">
    <h3 id="dlg-name-title">Name</h3>
    <input type="text" id="dlg-name-inp">
    <div class="dialog-btns">
      <button class="btn-cancel" onclick="closeDlg('dlg-name')">Abbrechen</button>
      <button class="btn-ok" onclick="confirmNameDlg()">OK</button>
    </div>
  </div>
</div>

<!-- OPEN DLG -->
<div class="overlay" id="dlg-open">
  <div class="dialog" style="max-width:360px">
    <h3>Projekt öffnen</h3>
    <div id="dlg-open-list" style="max-height:300px;overflow-y:auto;margin:10px 0;"></div>
    <div class="dialog-btns"><button class="btn-cancel" onclick="closeDlg('dlg-open')">Abbrechen</button></div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════════
// SYMBOL DEFINITIONS
// ══════════════════════════════════════════════════
const SYMS = {
  steckdose:  { label:'Steckdose',        color:'#22C55E', short:'Steckdosen' },
  steckdose2: { label:'Steckdose 2-fach', color:'#22C55E', short:'Steckdosen 2f' },
  schalter:   { label:'Ausschalter',      color:'#22C55E', short:'Ausschalter' },
  wechsel:    { label:'Wechselschalter',  color:'#22C55E', short:'Wechselschalter' },
  kreuz:      { label:'Kreuzschalter',    color:'#22C55E', short:'Kreuzschalter' },
  taster:     { label:'Taster',           color:'#22C55E', short:'Taster' },
  verteiler:  { label:'Verteilerdose',    color:'#22C55E', short:'Verteilerdosen' },
  sicherung:  { label:'Sicherungskasten', color:'#22C55E', short:'Sicherungskästen' },
  data:       { label:'Datensteckdose',   color:'#22C55E', short:'Datensteckdosen' },
  licht:      { label:'Lichtpunkt',       color:'#EF5350', short:'Lichtpunkte' },
  leuchte:    { label:'Leuchte',          color:'#EF5350', short:'Leuchten' },
  spot:       { label:'Spot/Einbau',      color:'#EF5350', short:'Spots' },
};

// ══════════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════════
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const wrap = document.getElementById('canvas-wrap');

let walls=[], symbols=[];
let undoStack=[], redoStack=[];
let tool='none', selectedSym=null;
let wallThick=5, wallClr='#1F2937';
let projectName='Neues Projekt';
let vx=0,vy=0,vs=1;

let drawStart=null,drawCurrent=null,snapEnd=false;
let dragSymIdx=null,dragWallIdx=null,dragPrev=null;
let panStart=null,panOff=null;
let pinchDist0=0,pinchScale0=1,pinchVx0=0,pinchVy0=0,pinchMid=null;

let lenCb=null,nameCb=null;

function resize(){canvas.width=wrap.clientWidth;canvas.height=wrap.clientHeight;render();}
window.addEventListener('resize',resize);
setTimeout(resize,50);

// ══════════════════════════════════════════════════
// COORDS
// ══════════════════════════════════════════════════
function toC(sx,sy){return{x:(sx-vx)/vs,y:(sy-vy)/vs};}
function toS(cx,cy){return{x:cx*vs+vx,y:cy*vs+vy};}

// ══════════════════════════════════════════════════
// UNDO/REDO
// ══════════════════════════════════════════════════
function snap(){
  undoStack.push({w:JSON.parse(JSON.stringify(walls)),s:JSON.parse(JSON.stringify(symbols))});
  if(undoStack.length>60)undoStack.shift();
  redoStack=[];updUR();
}
function undo(){
  if(!undoStack.length)return;
  redoStack.push({w:JSON.parse(JSON.stringify(walls)),s:JSON.parse(JSON.stringify(symbols))});
  const u=undoStack.pop();walls=u.w;symbols=u.s;updUR();updStats();render();
}
function redo(){
  if(!redoStack.length)return;
  undoStack.push({w:JSON.parse(JSON.stringify(walls)),s:JSON.parse(JSON.stringify(symbols))});
  const u=redoStack.pop();walls=u.w;symbols=u.s;updUR();updStats();render();
}
function updUR(){
  document.getElementById('btn-undo').disabled=!undoStack.length;
  document.getElementById('btn-redo').disabled=!redoStack.length;
}

// ══════════════════════════════════════════════════
// TOOLS
// ══════════════════════════════════════════════════
function setTool(t){
  tool=t;selectedSym=null;
  document.querySelectorAll('.tool-btn').forEach(b=>b.classList.remove('active','active-red','active-green2','pan-active'));
  if(t==='wall'){document.getElementById('tool-wall').classList.add('active');setStatus('✏️  Wand zeichnen — ziehen, dann Länge eingeben','#4FC3F7');}
  else if(t==='pan'){document.getElementById('tool-pan').classList.add('pan-active');setStatus('✋  Verschieben / Zoomen','#34D399');}
  else setStatus('← Werkzeug wählen','#6B7280');
}
function setSym(s){
  tool='sym';selectedSym=s;
  document.querySelectorAll('.tool-btn').forEach(b=>b.classList.remove('active','active-red','active-green2','pan-active'));
  const isRed=SYMS[s].color==='#EF5350';
  document.getElementById('sym-'+s).classList.add(isRed?'active-red':'active-green2');
  setStatus('⚡  '+SYMS[s].label+' platzieren', isRed?'#EF5350':'#22C55E');
}
function setStatus(t,c){
  document.getElementById('status-text').textContent=t;
  document.getElementById('status-text').style.color=c;
  document.getElementById('status-dot').style.background=c;
}
function setThick(t){
  wallThick=t;
  ['thin','norm','bold'].forEach(id=>document.getElementById('thick-'+id).classList.remove('active'));
  if(t===2)document.getElementById('thick-thin').classList.add('active');
  else if(t===5)document.getElementById('thick-norm').classList.add('active');
  else document.getElementById('thick-bold').classList.add('active');
}
function setWallColor(c,el){
  wallClr=c;
  document.querySelectorAll('.color-dot').forEach(d=>d.classList.remove('active'));
  el.classList.add('active');
}

// ══════════════════════════════════════════════════
// HIT TEST & SNAP
// ══════════════════════════════════════════════════
function snapAxis(sx,sy,ex,ey){const dx=Math.abs(ex-sx),dy=Math.abs(ey-sy);return dx>dy?{x:ex,y:sy}:{x:sx,y:ey};}
function snapEP(cx,cy,thr){
  let best=null,md=thr/vs;
  for(const w of walls){for(const p of [{x:w.sx,y:w.sy},{x:w.ex,y:w.ey}]){const d=Math.hypot(p.x-cx,p.y-cy);if(d<md){md=d;best=p;}}}
  return best;
}
function ppm(){for(const w of walls){if(w.len&&w.len>0){const px=Math.hypot(w.ex-w.sx,w.ey-w.sy);if(px>0)return px/w.len;}}return 80;}
function hitWall(cx,cy,thr){
  const t=thr/vs;
  for(let i=walls.length-1;i>=0;i--){
    const w=walls[i],dx=w.ex-w.sx,dy=w.ey-w.sy,len2=dx*dx+dy*dy;
    if(!len2)continue;
    const tv=Math.max(0,Math.min(1,((cx-w.sx)*dx+(cy-w.sy)*dy)/len2));
    if(Math.hypot(cx-(w.sx+tv*dx),cy-(w.sy+tv*dy))<t)return i;
  }return -1;
}
function hitSym(cx,cy,thr){
  const t=thr/vs;
  for(let i=symbols.length-1;i>=0;i--){if(Math.hypot(symbols[i].x-cx,symbols[i].y-cy)<t)return i;}
  return -1;
}

// ══════════════════════════════════════════════════
// TOUCH EVENTS
// ══════════════════════════════════════════════════
canvas.addEventListener('touchstart',onTS,{passive:false});
canvas.addEventListener('touchmove',onTM,{passive:false});
canvas.addEventListener('touchend',onTE,{passive:false});
canvas.addEventListener('click',onCK);

function getXY(e){const r=canvas.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top};}

function onTS(e){
  e.preventDefault();
  if(e.touches.length===2){
    const r=canvas.getBoundingClientRect();
    const t1=e.touches[0],t2=e.touches[1];
    pinchDist0=Math.hypot(t1.clientX-t2.clientX,t1.clientY-t2.clientY);
    pinchScale0=vs;pinchVx0=vx;pinchVy0=vy;
    pinchMid={x:(t1.clientX+t2.clientX)/2-r.left,y:(t1.clientY+t2.clientY)/2-r.top};
    dragSymIdx=null;dragWallIdx=null;drawStart=null;return;
  }
  const p=getXY(e);startI(p.x,p.y);
}
function onTM(e){
  e.preventDefault();
  if(e.touches.length===2){
    const r=canvas.getBoundingClientRect();
    const t1=e.touches[0],t2=e.touches[1];
    const d=Math.hypot(t1.clientX-t2.clientX,t1.clientY-t2.clientY);
    const ns=Math.max(0.2,Math.min(8,pinchScale0*d/pinchDist0));
    const fc={x:(pinchMid.x-pinchVx0)/pinchScale0,y:(pinchMid.y-pinchVy0)/pinchScale0};
    const mid={x:(t1.clientX+t2.clientX)/2-r.left,y:(t1.clientY+t2.clientY)/2-r.top};
    vs=ns;vx=mid.x-fc.x*ns;vy=mid.y-fc.y*ns;render();return;
  }
  const p=getXY(e);moveI(p.x,p.y);
}
function onTE(e){e.preventDefault();if(e.touches.length>0)return;endI();}
function onCK(e){
  const p=getXY(e),cp=toC(p.x,p.y);
  const si=hitSym(cp.x,cp.y,28);
  if(si>=0&&tool!=='sym'&&tool!=='wall'){showSymMenu(si,e.clientX,e.clientY);return;}
  const wi=hitWall(cp.x,cp.y,14);
  if(wi>=0&&tool!=='wall'){showWallMenu(wi,e.clientX,e.clientY);return;}
}

function startI(sx,sy){
  closeMenus();
  const cp=toC(sx,sy);
  const si=hitSym(cp.x,cp.y,28);
  if(si>=0){dragSymIdx=si;dragPrev=cp;return;}
  if(tool==='pan'||tool==='none'){
    const wi=hitWall(cp.x,cp.y,14);
    if(wi>=0){dragWallIdx=wi;dragPrev=cp;return;}
  }
  if(tool==='wall'){
    const sn=snapEP(cp.x,cp.y,25);
    drawStart=sn||cp;drawCurrent=drawStart;snapEnd=false;return;
  }
  if(tool==='sym'&&selectedSym){
    snap();symbols.push({type:selectedSym,x:cp.x,y:cp.y,rot:0,label:true,id:Date.now()});
    updStats();render();return;
  }
  if(tool==='pan'){panStart={x:sx,y:sy};panOff={x:vx,y:vy};}
}
function moveI(sx,sy){
  const cp=toC(sx,sy);
  if(dragSymIdx!==null){symbols[dragSymIdx].x=cp.x;symbols[dragSymIdx].y=cp.y;dragPrev=cp;render();return;}
  if(dragWallIdx!==null){
    const dx=cp.x-dragPrev.x,dy=cp.y-dragPrev.y;
    walls[dragWallIdx].sx+=dx;walls[dragWallIdx].sy+=dy;
    walls[dragWallIdx].ex+=dx;walls[dragWallIdx].ey+=dy;
    dragPrev=cp;render();return;
  }
  if(tool==='wall'&&drawStart){
    const ax=snapAxis(drawStart.x,drawStart.y,cp.x,cp.y);
    const sn=snapEP(ax.x,ax.y,25);
    drawCurrent=sn||ax;snapEnd=!!sn;render();return;
  }
  if(tool==='pan'&&panStart){vx=panOff.x+(sx-panStart.x);vy=panOff.y+(sy-panStart.y);render();return;}
}
function endI(){
  if(dragSymIdx!==null){snap();dragSymIdx=null;dragPrev=null;updStats();return;}
  if(dragWallIdx!==null){snap();dragWallIdx=null;dragPrev=null;return;}
  if(tool==='wall'&&drawStart&&drawCurrent){
    const dist=Math.hypot(drawCurrent.x-drawStart.x,drawCurrent.y-drawStart.y);
    if(dist>10/vs){
      const s={...drawStart},e={...drawCurrent};
      showLenDlg('Wandlänge','',len=>{
        if(len>0){
          const p2=ppm(),d=Math.hypot(e.x-s.x,e.y-s.y);
          const nx=d<.001?1:(e.x-s.x)/d,ny=d<.001?0:(e.y-s.y)/d;
          snap();walls.push({sx:s.x,sy:s.y,ex:s.x+nx*len*p2,ey:s.y+ny*len*p2,len,thick:wallThick,color:wallClr,id:Date.now()});
          updStats();render();
        }
      });
    }
    drawStart=null;drawCurrent=null;snapEnd=false;render();
  }
  panStart=null;
}

// ══════════════════════════════════════════════════
// ZOOM
// ══════════════════════════════════════════════════
function zoomIn(){const ns=Math.min(8,vs*1.25);vx=canvas.width/2-(canvas.width/2-vx)*ns/vs;vy=canvas.height/2-(canvas.height/2-vy)*ns/vs;vs=ns;render();}
function zoomOut(){const ns=Math.max(0.2,vs/1.25);vx=canvas.width/2-(canvas.width/2-vx)*ns/vs;vy=canvas.height/2-(canvas.height/2-vy)*ns/vs;vs=ns;render();}
function resetView(){vx=0;vy=0;vs=1;render();}

// ══════════════════════════════════════════════════
// RENDER
// ══════════════════════════════════════════════════
function render(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle='#F0F4F8';ctx.fillRect(0,0,canvas.width,canvas.height);
  drawGrid();
  walls.forEach(w=>drawWall(w,false));
  if(drawStart&&drawCurrent)drawPreview();
  symbols.forEach((s,i)=>drawSym(s,i===dragSymIdx));
}

function drawGrid(){
  const step=50*vs;
  ctx.strokeStyle='rgba(203,213,225,0.6)';ctx.lineWidth=0.5;
  ctx.beginPath();
  for(let x=vx%step;x<canvas.width;x+=step){ctx.moveTo(x,0);ctx.lineTo(x,canvas.height);}
  for(let y=vy%step;y<canvas.height;y+=step){ctx.moveTo(0,y);ctx.lineTo(canvas.width,y);}
  ctx.stroke();
}

function drawWall(w,hl){
  const s=toS(w.sx,w.sy),e=toS(w.ex,w.ey);
  ctx.strokeStyle=hl?'#4FC3F7':w.color;
  ctx.lineWidth=Math.max(2,w.thick*vs);ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(e.x,e.y);ctx.stroke();
  const dr=Math.max(3,5*vs);
  ctx.fillStyle=hl?'#4FC3F7':'#94A3B8';
  ctx.beginPath();ctx.arc(s.x,s.y,dr,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(e.x,e.y,dr,0,Math.PI*2);ctx.fill();
  if(w.len){
    const mx=(s.x+e.x)/2,my=(s.y+e.y)/2;
    const fs=Math.max(10,13*vs),lbl=w.len.toFixed(2)+' m';
    ctx.font=`bold ${fs}px -apple-system,sans-serif`;
    const tw=ctx.measureText(lbl).width;
    const isH=Math.abs(w.ex-w.sx)>Math.abs(w.ey-w.sy);
    const lx=mx-tw/2,ly=isH?my-9*vs:my-fs/2;
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.fillRect(lx-3,ly-fs+2,tw+6,fs+4);
    ctx.fillStyle=hl?'#4FC3F7':'#1D4ED8';ctx.fillText(lbl,lx,ly);
  }
}

function drawPreview(){
  const s=toS(drawStart.x,drawStart.y),e=toS(drawCurrent.x,drawCurrent.y);
  ctx.strokeStyle='rgba(79,195,247,0.9)';ctx.lineWidth=Math.max(2,4*vs);ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(e.x,e.y);ctx.stroke();
  const dr=Math.max(4,6*vs);
  ctx.fillStyle='#22C55E';ctx.beginPath();ctx.arc(s.x,s.y,dr,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=snapEnd?'#22C55E':'#4FC3F7';ctx.beginPath();ctx.arc(e.x,e.y,dr,0,Math.PI*2);ctx.fill();
}

function drawSym(sym,drag){
  const p=toS(sym.x,sym.y),r=Math.max(12,18*vs);
  const clr=drag?'#4FC3F7':SYMS[sym.type].color;
  ctx.save();
  ctx.translate(p.x,p.y);ctx.rotate(sym.rot*Math.PI/180);ctx.translate(-p.x,-p.y);
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=clr;ctx.lineWidth=Math.max(1.5,2*vs);
  ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.stroke();
  drawIcon(sym.type,p.x,p.y,r*0.55,clr);
  ctx.restore();
  if(sym.label){
    const fs=Math.max(8,10*vs),lbl=SYMS[sym.type].label;
    ctx.font=`600 ${fs}px -apple-system,sans-serif`;
    const tw=ctx.measureText(lbl).width;
    ctx.fillStyle='rgba(255,255,255,0.88)';ctx.fillRect(p.x-tw/2-2,p.y+r+1,tw+4,fs+3);
    ctx.fillStyle=clr;ctx.fillText(lbl,p.x-tw/2,p.y+r+fs+1);
  }
}

function drawIcon(type,cx,cy,r,clr){
  ctx.strokeStyle=clr;ctx.lineWidth=Math.max(1.2,1.8*vs);ctx.lineCap='round';ctx.lineJoin='round';ctx.fillStyle=clr;
  switch(type){
    case 'steckdose':
      ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.stroke();
      ctx.beginPath();ctx.moveTo(cx-r*.35,cy-r*.5);ctx.lineTo(cx-r*.35,cy+r*.5);ctx.stroke();
      ctx.beginPath();ctx.moveTo(cx+r*.35,cy-r*.5);ctx.lineTo(cx+r*.35,cy+r*.5);ctx.stroke();
      // Schutzkontakt arc
      ctx.beginPath();ctx.arc(cx,cy+r*.5,r*.25,0,Math.PI);ctx.stroke();
      break;
    case 'steckdose2':
      ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.stroke();
      ctx.beginPath();ctx.moveTo(cx-r*.55,cy-r*.5);ctx.lineTo(cx-r*.55,cy+r*.5);ctx.stroke();
      ctx.beginPath();ctx.moveTo(cx,cy-r*.5);ctx.lineTo(cx,cy+r*.5);ctx.stroke();
      ctx.beginPath();ctx.moveTo(cx+r*.55,cy-r*.5);ctx.lineTo(cx+r*.55,cy+r*.5);ctx.stroke();
      break;
    case 'schalter':
      // Ausschalter: circle + line going up-right + dot
      ctx.beginPath();ctx.arc(cx,cy+r*.2,r*.7,0,Math.PI*2);ctx.stroke();
      ctx.beginPath();ctx.moveTo(cx,cy-r*.5);ctx.lineTo(cx+r*.9,cy-r*1.3);ctx.stroke();
      ctx.beginPath();ctx.arc(cx+r*.9,cy-r*1.3,r*.22,0,Math.PI*2);ctx.fill();
      break;
    case 'wechsel':
      // Two circles + diagonal line (Wechselschalter)
      ctx.beginPath();ctx.arc(cx-r*.55,cy,r*.42,0,Math.PI*2);ctx.stroke();
      ctx.beginPath();ctx.arc(cx+r*.55,cy,r*.42,0,Math.PI*2);ctx.stroke();
      ctx.beginPath();ctx.moveTo(cx-r*.2,cy-r*.3);ctx.lineTo(cx+r*.2,cy-r*.75);ctx.stroke();
      break;
    case 'kreuz':
      // Circle with X inside
      ctx.beginPath();ctx.arc(cx,cy,r*.85,0,Math.PI*2);ctx.stroke();
      ctx.beginPath();ctx.moveTo(cx-r*.5,cy-r*.5);ctx.lineTo(cx+r*.5,cy+r*.5);ctx.stroke();
      ctx.beginPath();ctx.moveTo(cx+r*.5,cy-r*.5);ctx.lineTo(cx-r*.5,cy+r*.5);ctx.stroke();
      // extra lines top/bottom for Kreuzschalter look
      ctx.beginPath();ctx.moveTo(cx,cy-r*.85);ctx.lineTo(cx,cy-r*1.3);ctx.stroke();
      ctx.beginPath();ctx.moveTo(cx,cy+r*.85);ctx.lineTo(cx,cy+r*1.3);ctx.stroke();
      break;
    case 'taster':
      // Double circle (Taster)
      ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.stroke();
      ctx.beginPath();ctx.arc(cx,cy,r*.42,0,Math.PI*2);ctx.stroke();
      break;
    case 'verteiler':
      ctx.strokeRect(cx-r*.75,cy-r*.75,r*1.5,r*1.5);
      ctx.beginPath();ctx.moveTo(cx-r*.5,cy-r*.5);ctx.lineTo(cx+r*.5,cy+r*.5);ctx.stroke();
      ctx.beginPath();ctx.moveTo(cx+r*.5,cy-r*.5);ctx.lineTo(cx-r*.5,cy+r*.5);ctx.stroke();
      break;
    case 'sicherung':
      ctx.strokeRect(cx-r*.85,cy-r*.6,r*1.7,r*1.2);
      ctx.beginPath();ctx.moveTo(cx-r*.65,cy-r*.18);ctx.lineTo(cx+r*.65,cy-r*.18);ctx.stroke();
      ctx.beginPath();ctx.moveTo(cx-r*.65,cy+r*.18);ctx.lineTo(cx+r*.65,cy+r*.18);ctx.stroke();
      break;
    case 'data':
      // T-shape (Datensteckdose)
      ctx.beginPath();ctx.moveTo(cx,cy-r*.9);ctx.lineTo(cx,cy+r*.2);ctx.stroke();
      ctx.beginPath();ctx.moveTo(cx-r*.7,cy+r*.2);ctx.lineTo(cx+r*.7,cy+r*.2);ctx.stroke();
      ctx.beginPath();ctx.moveTo(cx-r*.7,cy+r*.7);ctx.lineTo(cx+r*.7,cy+r*.7);ctx.stroke();
      break;
    case 'licht':
      // Sun symbol — circle + 8 rays
      ctx.beginPath();ctx.arc(cx,cy,r*.42,0,Math.PI*2);ctx.stroke();
      for(let i=0;i<8;i++){const a=i*Math.PI/4;ctx.beginPath();ctx.moveTo(cx+r*.55*Math.cos(a),cy+r*.55*Math.sin(a));ctx.lineTo(cx+r*.92*Math.cos(a),cy+r*.92*Math.sin(a));ctx.stroke();}
      break;
    case 'leuchte':
      // Circle with X inside (Leuchte)
      ctx.beginPath();ctx.arc(cx,cy,r*.9,0,Math.PI*2);ctx.stroke();
      ctx.beginPath();ctx.moveTo(cx-r*.55,cy-r*.55);ctx.lineTo(cx+r*.55,cy+r*.55);ctx.stroke();
      ctx.beginPath();ctx.moveTo(cx+r*.55,cy-r*.55);ctx.lineTo(cx-r*.55,cy+r*.55);ctx.stroke();
      break;
    case 'spot':
      // Circle with filled center + line
      ctx.beginPath();ctx.arc(cx,cy,r*.85,0,Math.PI*2);ctx.stroke();
      ctx.globalAlpha=0.35;ctx.beginPath();ctx.arc(cx,cy,r*.4,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
      ctx.beginPath();ctx.arc(cx,cy,r*.4,0,Math.PI*2);ctx.stroke();
      break;
  }
}

// ══════════════════════════════════════════════════
// STATS
// ══════════════════════════════════════════════════
function updStats(){
  document.getElementById('chip-walls').textContent=walls.length+' Wände';
  document.getElementById('chip-elems').textContent=symbols.length+' Elemente';
  let total=0;walls.forEach(w=>total+=(w.len||0));
  const td=document.getElementById('stats-total');
  if(total>0){td.style.display='flex';document.getElementById('stats-total-text').textContent='Gesamt: '+total.toFixed(1)+' m';}
  else td.style.display='none';
  const counts={};symbols.forEach(s=>counts[s.type]=(counts[s.type]||0)+1);
  const sc=document.getElementById('stats-chips');sc.innerHTML='';
  Object.entries(counts).forEach(([type,count])=>{
    const c=SYMS[type].color;
    const chip=document.createElement('div');
    chip.className='stat-chip';
    chip.style=`background:${c}20;border:1px solid ${c}50;color:${c}`;
    chip.innerHTML=`<div class="stat-dot" style="background:${c}"></div>${SYMS[type].short}: ${count}`;
    sc.appendChild(chip);
  });
}

// ══════════════════════════════════════════════════
// CONTEXT MENUS
// ══════════════════════════════════════════════════
function showSymMenu(i,x,y){
  const menu=document.getElementById('ctx-menu');
  const sym=symbols[i];
  menu.innerHTML=`
    <button class="ctx-item" onclick="rotSym(${i});closeMenus()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="17" height="17"><path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0118.8-4.3M22 12.5a10 10 0 01-18.8 4.2"/></svg>Drehen (90°)</button>
    <button class="ctx-item" onclick="dupSym(${i});closeMenus()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="17" height="17"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>Duplizieren</button>
    <button class="ctx-item" onclick="togLabel(${i});closeMenus()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="17" height="17"><path d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>${sym.label?'Bezeichnung aus':'Bezeichnung ein'}</button>
    <div class="ctx-sep"></div>
    <button class="ctx-item danger" onclick="delSym(${i});closeMenus()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="17" height="17"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/></svg>Löschen</button>`;
  posMenu(menu,x,y);
}
function showWallMenu(i,x,y){
  const menu=document.getElementById('ctx-menu');
  menu.innerHTML=`
    <button class="ctx-item" onclick="editWallLen(${i});closeMenus()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="17" height="17"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>Länge ändern</button>
    <button class="ctx-item" onclick="setWallTC(${i},2);closeMenus()">Dünn</button>
    <button class="ctx-item" onclick="setWallTC(${i},5);closeMenus()">Normal</button>
    <button class="ctx-item" onclick="setWallTC(${i},10);closeMenus()">Dick</button>
    <div class="ctx-sep"></div>
    <button class="ctx-item danger" onclick="delWall(${i});closeMenus()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="17" height="17"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/></svg>Löschen</button>`;
  posMenu(menu,x,y);
}
function posMenu(m,x,y){
  m.classList.add('show');
  const mw=m.offsetWidth||190,mh=m.offsetHeight||200;
  m.style.left=Math.min(x,window.innerWidth-mw-8)+'px';
  m.style.top=Math.min(y,window.innerHeight-mh-8)+'px';
}

function rotSym(i){snap();symbols[i].rot=(symbols[i].rot+90)%360;render();}
function dupSym(i){snap();symbols.push({...symbols[i],x:symbols[i].x+30,y:symbols[i].y+30,id:Date.now()});updStats();render();}
function togLabel(i){snap();symbols[i].label=!symbols[i].label;render();}
function delSym(i){snap();symbols.splice(i,1);updStats();render();}
function editWallLen(i){
  const w=walls[i];
  showLenDlg('Länge ändern',w.len||'',len=>{
    if(len>0){snap();const d=Math.hypot(w.ex-w.sx,w.ey-w.sy);const nx=d<.001?1:(w.ex-w.sx)/d,ny=d<.001?0:(w.ey-w.sy)/d;const p2=ppm();walls[i].ex=w.sx+nx*len*p2;walls[i].ey=w.sy+ny*len*p2;walls[i].len=len;updStats();render();}
  });
}
function setWallTC(i,t){snap();walls[i].thick=t;render();}
function delWall(i){snap();walls.splice(i,1);updStats();render();}

// ══════════════════════════════════════════════════
// DIALOGS
// ══════════════════════════════════════════════════
function showLenDlg(title,def,cb){
  document.getElementById('dlg-len-title').textContent=title;
  const inp=document.getElementById('dlg-len-inp');inp.value=def||'';
  lenCb=cb;document.getElementById('dlg-len').classList.add('show');
  setTimeout(()=>inp.focus(),100);
}
function confirmLen(){
  const v=parseFloat(document.getElementById('dlg-len-inp').value.replace(',','.'));
  closeDlg('dlg-len');if(lenCb){lenCb(v||0);lenCb=null;}
}
document.getElementById('dlg-len-inp').addEventListener('keydown',e=>{if(e.key==='Enter')confirmLen();});

function closeDlg(id){document.getElementById(id).classList.remove('show');}

function showNameDlg(title,def,cb){
  document.getElementById('dlg-name-title').textContent=title;
  document.getElementById('dlg-name-inp').value=def||'';
  nameCb=cb;document.getElementById('dlg-name').classList.add('show');
  setTimeout(()=>document.getElementById('dlg-name-inp').focus(),100);
}
function confirmNameDlg(){
  const v=document.getElementById('dlg-name-inp').value.trim();
  closeDlg('dlg-name');if(nameCb){nameCb(v);nameCb=null;}
}
document.getElementById('dlg-name-inp').addEventListener('keydown',e=>{if(e.key==='Enter')confirmNameDlg();});

function showConfirm(title,text,cb){
  document.getElementById('dlg-confirm-title').textContent=title;
  document.getElementById('dlg-confirm-text').textContent=text;
  document.getElementById('dlg-confirm-ok').onclick=()=>{closeDlg('dlg-confirm');if(cb)cb();};
  document.getElementById('dlg-confirm').classList.add('show');
}

// ══════════════════════════════════════════════════
// PROJECT MENU
// ══════════════════════════════════════════════════
function toggleDropdown(){document.getElementById('dropdown').classList.toggle('show');}
function closeMenus(){
  document.getElementById('dropdown').classList.remove('show');
  document.getElementById('ctx-menu').classList.remove('show');
}
document.addEventListener('click',e=>{
  if(!e.target.closest('#dropdown')&&!e.target.closest('#menu-btn'))document.getElementById('dropdown').classList.remove('show');
  if(!e.target.closest('#ctx-menu'))document.getElementById('ctx-menu').classList.remove('show');
});

function newProject(){
  closeMenus();
  showConfirm('Neues Projekt','Aktuelles Projekt verwerfen?',()=>{
    walls=[];symbols=[];undoStack=[];redoStack=[];projectName='Neues Projekt';
    document.getElementById('proj-label').textContent=projectName;
    updUR();updStats();render();
  });
}
function saveProject(){
  closeMenus();
  const data={name:projectName,walls,symbols};
  const all=loadAll();const idx=all.findIndex(p=>p.name===projectName);
  if(idx>=0)all[idx]=data;else all.push(data);
  localStorage.setItem('ep_projects',JSON.stringify(all));
  toast('✅ "'+projectName+'" gespeichert');
}
function openProject(){
  closeMenus();const all=loadAll();
  if(!all.length){toast('Keine gespeicherten Projekte');return;}
  const list=document.getElementById('dlg-open-list');list.innerHTML='';
  all.forEach(p=>{
    const btn=document.createElement('button');
    btn.style='width:100%;text-align:left;padding:12px;background:none;border:none;color:#fff;cursor:pointer;border-radius:8px;';
    btn.innerHTML=`<div style="font-weight:600">${p.name}</div><div style="font-size:12px;color:#6B7280">${(p.walls||[]).length} Wände · ${(p.symbols||[]).length} Elemente</div>`;
    btn.onmouseover=()=>btn.style.background='rgba(255,255,255,.05)';
    btn.onmouseout=()=>btn.style.background='none';
    btn.onclick=()=>{walls=p.walls||[];symbols=p.symbols||[];projectName=p.name;document.getElementById('proj-label').textContent=projectName;undoStack=[];redoStack=[];updUR();updStats();render();closeDlg('dlg-open');};
    list.appendChild(btn);
  });
  document.getElementById('dlg-open').classList.add('show');
}
function renameProject(){
  closeMenus();
  showNameDlg('Umbenennen',projectName,name=>{if(name){projectName=name;document.getElementById('proj-label').textContent=name;}});
}
function duplicateProject(){
  closeMenus();const newName=projectName+' (Kopie)';
  const all=loadAll();all.push({name:newName,walls:JSON.parse(JSON.stringify(walls)),symbols:JSON.parse(JSON.stringify(symbols))});
  localStorage.setItem('ep_projects',JSON.stringify(all));
  toast('✅ Dupliziert als "'+newName+'"');
}
function loadAll(){try{return JSON.parse(localStorage.getItem('ep_projects')||'[]');}catch{return[];}}
function confirmClear(){
  closeMenus();
  showConfirm('Alles löschen?','Alle Wände und Elemente werden gelöscht.',()=>{snap();walls=[];symbols=[];updStats();render();});
}
function toast(msg){
  let t=document.getElementById('toast');
  if(!t){t=document.createElement('div');t.id='toast';t.style='position:fixed;bottom:60px;left:50%;transform:translateX(-50%);background:#059669;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;z-index:9999;pointer-events:none;transition:opacity .3s';document.body.appendChild(t);}
  t.textContent=msg;t.style.opacity='1';clearTimeout(t._t);t._t=setTimeout(()=>t.style.opacity='0',2500);
}

updStats();setStatus('← Werkzeug wählen','#6B7280');render();
</script>
</body>
