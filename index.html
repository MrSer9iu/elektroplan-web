<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ElektroPlan">
<meta name="theme-color" content="#0F1623">
<title>ElektroPlan</title>
<style>
:root{--bg:#0F1623;--sb:#1A1F2E;--bd:#2D3448;--mu:#6B7280;--bl:#4FC3F7;--gr:#22C55E;--rd:#EF5350;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:-apple-system,sans-serif;}
#app{display:flex;flex-direction:column;height:100%;}
#topbar{height:50px;background:#0A0F1A;border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 10px;gap:5px;flex-shrink:0;overflow-x:auto;}
#menu-btn{display:flex;align-items:center;gap:5px;padding:6px 10px;background:linear-gradient(135deg,#4FC3F7,#0288D1);border-radius:8px;border:none;color:#fff;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0;}
#sd{width:8px;height:8px;border-radius:50%;background:var(--mu);flex-shrink:0;}
#st{font-size:12px;color:var(--mu);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:80px;}
.tbb{width:34px;height:34px;background:#1A2035;border:none;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:background .15s;}
.tbb:disabled{opacity:.3;cursor:default;}
.tbb svg{width:18px;height:18px;}
.tbb:not(:disabled):hover{background:#243050;}
.tsep{width:1px;height:28px;background:var(--bd);flex-shrink:0;}
.tbch{display:flex;align-items:center;gap:4px;padding:4px 8px;background:#1A2035;border-radius:20px;font-size:10px;color:var(--mu);white-space:nowrap;flex-shrink:0;}
#main{display:flex;flex:1;overflow:hidden;}
#sb{width:82px;background:var(--sb);border-right:1px solid var(--bd);display:flex;flex-direction:column;align-items:center;padding:5px 0;overflow-y:auto;flex-shrink:0;gap:1px;}
.sdiv{width:58px;height:1px;background:var(--bd);margin:3px 0;flex-shrink:0;}
.slbl{font-size:8px;letter-spacing:.8px;flex-shrink:0;}
.tb{width:70px;padding:6px 3px;border-radius:10px;border:1px solid transparent;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:8px;line-height:1.2;text-align:center;flex-shrink:0;transition:all .15s;}
.tb svg{width:28px;height:28px;}
.tb.abl{background:rgba(79,195,247,.12);color:#4FC3F7;border-color:rgba(79,195,247,.4);}
.tb.agr{background:rgba(34,197,94,.1);color:#22C55E;border-color:rgba(34,197,94,.35);}
.tb.ard{background:rgba(239,83,80,.1);color:#EF5350;border-color:rgba(239,83,80,.35);}
.tb.atn{background:rgba(52,211,153,.1);color:#34D399;border-color:rgba(52,211,153,.35);}
.tb{color:var(--mu);}
.tkr{display:flex;gap:4px;padding:2px;}
.tkb{width:22px;height:22px;border-radius:5px;border:1px solid transparent;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.tkb.a{background:rgba(79,195,247,.12);border-color:rgba(79,195,247,.4);}
.tkl{background:var(--mu);border-radius:1px;width:14px;}
.tkb.a .tkl{background:#4FC3F7;}
.clr{display:flex;flex-wrap:wrap;gap:4px;padding:3px 6px;justify-content:center;}
.cd{width:16px;height:16px;border-radius:50%;cursor:pointer;border:2px solid transparent;}
.cd.a{border-color:#fff;}
#cw{flex:1;position:relative;overflow:hidden;background:#EAEFF5;}
#cv{position:absolute;top:0;left:0;touch-action:none;}
#cm{position:fixed;background:#1E2436;border-radius:12px;padding:6px 0;box-shadow:0 8px 32px rgba(0,0,0,.55);z-index:999;min-width:190px;display:none;border:1px solid var(--bd);}
#cm.s{display:block;}
.ci{display:flex;align-items:center;gap:10px;padding:10px 16px;font-size:13px;color:#fff;cursor:pointer;border:none;background:none;width:100%;}
.ci:active{background:rgba(255,255,255,.06);}
.ci.d{color:var(--rd);}
.ci svg{width:16px;height:16px;flex-shrink:0;}
.csep{height:1px;background:var(--bd);margin:3px 0;}
#statsbar{height:46px;background:#0A0F1A;border-top:1px solid var(--bd);display:flex;align-items:center;padding:0 12px;gap:7px;overflow-x:auto;flex-shrink:0;}
.sc{display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;flex-shrink:0;}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:1000;display:none;align-items:center;justify-content:center;}
.ov.s{display:flex;}
.dlg{background:#1E2436;border-radius:16px;padding:22px;min-width:300px;max-width:420px;width:92%;border:1px solid var(--bd);}
.dlg h3{color:#fff;font-size:18px;margin-bottom:12px;}
.dlg p{color:var(--mu);font-size:14px;margin-bottom:12px;}
.dlg label{color:var(--mu);font-size:13px;display:block;margin-bottom:7px;}
.dlg input{width:100%;background:#111827;border:1px solid #374151;border-radius:10px;padding:12px;color:#fff;font-size:22px;text-align:center;outline:none;}
.dlg input[type=text]{font-size:15px;text-align:left;}
.dlg input:focus{border-color:var(--bl);}
.dbtns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;}
.bc{background:none;border:none;color:var(--mu);padding:8px 14px;border-radius:8px;cursor:pointer;font-size:13px;}
.bo{background:var(--bl);border:none;color:#000;padding:8px 18px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:700;}
.bda{background:var(--rd);border:none;color:#fff;padding:8px 18px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:700;}
#dd{position:fixed;background:#1E2436;border-radius:12px;padding:6px 0;box-shadow:0 8px 32px rgba(0,0,0,.65);z-index:999;min-width:200px;display:none;border:1px solid var(--bd);top:54px;left:10px;}
#dd.s{display:block;}
.di{display:flex;align-items:center;gap:10px;padding:11px 16px;font-size:13px;color:#fff;cursor:pointer;border:none;background:none;width:100%;}
.di:active{background:rgba(255,255,255,.05);}
.di.d{color:var(--rd);}
.di svg{width:15px;height:15px;flex-shrink:0;}
.dsep{height:1px;background:var(--bd);margin:3px 0;}
</style>
</head>
<body>
<div id="app">
<!-- TOPBAR -->
<div id="topbar">
  <button id="menu-btn" onclick="toggleDD()">
    <svg viewBox="0 0 24 24" fill="currentColor" width="15" height="15"><path d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
    <span id="plbl">Neues Projekt</span>
    <svg viewBox="0 0 24 24" fill="currentColor" width="15" height="15"><path d="M7 10l5 5 5-5z"/></svg>
  </button>
  <div id="sd"></div>
  <span id="st">← Werkzeug wählen</span>
  <div class="tsep"></div>
  <!-- UNDO: curved arrow left -->
  <button class="tbb" id="bundo" onclick="undo()" disabled title="Rückgängig (Ctrl+Z)">
    <svg viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="9,14 4,9 9,4"/>
      <path d="M20 20v-7a4 4 0 0 0-4-4H4"/>
    </svg>
  </button>
  <!-- REDO: curved arrow right -->
  <button class="tbb" id="bredo" onclick="redo()" disabled title="Wiederholen (Ctrl+Y)">
    <svg viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15,14 20,9 15,4"/>
      <path d="M4 20v-7a4 4 0 0 1 4-4h12"/>
    </svg>
  </button>
  <div class="tsep"></div>
  <button class="tbb" onclick="zIn()" title="Zoom +">
    <svg viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
  </button>
  <button class="tbb" onclick="zOut()" title="Zoom -">
    <svg viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="8" y1="11" x2="14" y2="11"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
  </button>
  <button class="tbb" onclick="zReset()" title="Reset">
    <svg viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round"><path d="M3.51 9a9 9 0 1 1-.49 3"/><polyline points="3 3 3 9 9 9"/></svg>
  </button>
  <div class="tsep"></div>
  <div class="tbch"><span id="cwalls">0 Wände</span></div>
  <div class="tbch"><span id="celems">0 Elemente</span></div>
</div>

<div id="main">
<!-- SIDEBAR -->
<div id="sb">
  <button class="tb" id="tw" onclick="setTool('wall')">
    <svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="11" width="22" height="6" rx="1"/><line x1="9" y1="11" x2="9" y2="17"/><line x1="19" y1="11" x2="19" y2="17"/></svg>Wand
  </button>
  <button class="tb" id="tp" onclick="setTool('pan')">
    <svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M14 4v8M10 6v6M18 6v6M6 12v5a8 8 0 0016 0v-5"/></svg>Bewegen
  </button>
  <div class="sdiv"></div>
  <span class="slbl" style="color:var(--mu)">WAND</span>
  <div class="tkr">
    <button class="tkb" id="tkt" onclick="setThk(3)" title="Dünn"><div class="tkl" style="height:2px"></div></button>
    <button class="tkb a" id="tkn" onclick="setThk(6)" title="Normal"><div class="tkl" style="height:4px"></div></button>
    <button class="tkb" id="tkb" onclick="setThk(12)" title="Dick"><div class="tkl" style="height:8px"></div></button>
  </div>
  <div class="clr">
    <div class="cd a" style="background:#2D3748" onclick="setWC('#2D3748',this)"></div>
    <div class="cd" style="background:#1D4ED8" onclick="setWC('#1D4ED8',this)"></div>
    <div class="cd" style="background:#065F46" onclick="setWC('#065F46',this)"></div>
    <div class="cd" style="background:#7C2D12" onclick="setWC('#7C2D12',this)"></div>
    <div class="cd" style="background:#4C1D95" onclick="setWC('#4C1D95',this)"></div>
    <div class="cd" style="background:#78716C" onclick="setWC('#78716C',this)"></div>
  </div>
  <div class="sdiv"></div>
  <span class="slbl" style="color:#22C55E">● 230V</span>

const cv=document.getElementById('cv'),cx=cv.getContext('2d'),cw=document.getElementById('cw');
let W=[],S=[],US=[],RS=[],tool='none',sym=null,wt=6,wc='#2D3748',pn='Neues Projekt';
let vx=0,vy=0,vs=1;
let ds=null,dc=null,se=false;
let dsi=null,dwi=null,dp=null;
let ps=null,po=null;
let pd0=0,ps0=1,pvx0=0,pvy0=0,pm=null;
let lcb=null,ncb=null;

function resize(){cv.width=cw.clientWidth;cv.height=cw.clientHeight;render();}
window.addEventListener('resize',resize);setTimeout(resize,60);

// coords
const tC=(sx,sy)=>({x:(sx-vx)/vs,y:(sy-vy)/vs});
const tS=(cx2,cy2)=>({x:cx2*vs+vx,y:cy2*vs+vy});

// ══════════════════════════════════
// UNDO/REDO
// ══════════════════════════════════
function snp(){
  US.push({w:JSON.parse(JSON.stringify(W)),s:JSON.parse(JSON.stringify(S))});
  if(US.length>60)US.shift();RS=[];updUR();
}
function undo(){
  if(!US.length)return;
  RS.push({w:JSON.parse(JSON.stringify(W)),s:JSON.parse(JSON.stringify(S))});
  const u=US.pop();W=u.w;S=u.s;updUR();updSt();render();
}
function redo(){
  if(!RS.length)return;
  US.push({w:JSON.parse(JSON.stringify(W)),s:JSON.parse(JSON.stringify(S))});
  const u=RS.pop();W=u.w;S=u.s;updUR();updSt();render();
}
function updUR(){
  const bu=document.getElementById('bundo'),br=document.getElementById('bredo');
  bu.disabled=!US.length;br.disabled=!RS.length;
  bu.querySelector('svg').querySelector('polyline').setAttribute('stroke',US.length?'#E2E8F0':'#374151');
  bu.querySelector('svg').querySelector('path').setAttribute('stroke',US.length?'#E2E8F0':'#374151');
  br.querySelector('svg').querySelector('polyline').setAttribute('stroke',RS.length?'#E2E8F0':'#374151');
  br.querySelector('svg').querySelector('path').setAttribute('stroke',RS.length?'#E2E8F0':'#374151');
}

// keyboard shortcuts
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key==='z'){e.preventDefault();undo();}
  if((e.ctrlKey||e.metaKey)&&(e.key==='y'||(e.shiftKey&&e.key==='Z'))){e.preventDefault();redo();}
});

// ══════════════════════════════════
// TOOLS
// ══════════════════════════════════
function setTool(t){
  tool=t;sym=null;
  document.querySelectorAll('.tb').forEach(b=>b.classList.remove('abl','agr','ard','atn'));
  if(t==='wall'){document.getElementById('tw').classList.add('abl');setSt('✏️  Wand zeichnen — ziehen, Länge eingeben','#4FC3F7');}
  else if(t==='pan'){document.getElementById('tp').classList.add('atn');setSt('✋  Verschieben aktiv','#34D399');}
  else setSt('← Werkzeug wählen','#6B7280');
}
function setSym(s){
  tool='sym';sym=s;
  document.querySelectorAll('.tb').forEach(b=>b.classList.remove('abl','agr','ard','atn'));
  const isR=SD[s].c==='#EF5350';
  document.getElementById('sy-'+s).classList.add(isR?'ard':'agr');
  setSt('⚡  '+SD[s].l+' platzieren',isR?'#EF5350':'#22C55E');
}
function setSt(t,c){document.getElementById('st').textContent=t;document.getElementById('st').style.color=c;document.getElementById('sd').style.background=c;}
function setThk(t){
  wt=t;
  ['tkt','tkn','tkb'].forEach(id=>document.getElementById(id).classList.remove('a'));
  if(t===3)document.getElementById('tkt').classList.add('a');
  else if(t===6)document.getElementById('tkn').classList.add('a');
  else document.getElementById('tkb').classList.add('a');
}
function setWC(c,el){wc=c;document.querySelectorAll('.cd').forEach(d=>d.classList.remove('a'));el.classList.add('a');}

// ══════════════════════════════════
// HIT/SNAP
// ══════════════════════════════════
function sAx(sx,sy,ex,ey){const dx=Math.abs(ex-sx),dy=Math.abs(ey-sy);return dx>dy?{x:ex,y:sy}:{x:sx,y:ey};}
function sEP(cx2,cy2,thr){
  let b=null,md=thr/vs;
  for(const w of W)for(const p of [{x:w.sx,y:w.sy},{x:w.ex,y:w.ey}]){const d=Math.hypot(p.x-cx2,p.y-cy2);if(d<md){md=d;b=p;}}
  return b;
}
function ppm(){for(const w of W){if(w.len&&w.len>0){const px=Math.hypot(w.ex-w.sx,w.ey-w.sy);if(px>0)return px/w.len;}}return 80;}
function hW(cx2,cy2,thr){
  const t=thr/vs;
  for(let i=W.length-1;i>=0;i--){
    const w=W[i],dx=w.ex-w.sx,dy=w.ey-w.sy,l2=dx*dx+dy*dy;
    if(!l2)continue;
    const tv=Math.max(0,Math.min(1,((cx2-w.sx)*dx+(cy2-w.sy)*dy)/l2));
    if(Math.hypot(cx2-(w.sx+tv*dx),cy2-(w.sy+tv*dy))<t)return i;
  }return -1;
}
function hS(cx2,cy2,thr){const t=thr/vs;for(let i=S.length-1;i>=0;i--)if(Math.hypot(S[i].x-cx2,S[i].y-cy2)<t)return i;return -1;}

// ══════════════════════════════════
// TOUCH
// ══════════════════════════════════
cv.addEventListener('touchstart',onTS,{passive:false});
cv.addEventListener('touchmove',onTM,{passive:false});
cv.addEventListener('touchend',onTE,{passive:false});
cv.addEventListener('click',onCK);
function gXY(e){const r=cv.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top};}
function onTS(e){
  e.preventDefault();
  if(e.touches.length===2){
    const r=cv.getBoundingClientRect(),t1=e.touches[0],t2=e.touches[1];
    pd0=Math.hypot(t1.clientX-t2.clientX,t1.clientY-t2.clientY);
    ps0=vs;pvx0=vx;pvy0=vy;
    pm={x:(t1.clientX+t2.clientX)/2-r.left,y:(t1.clientY+t2.clientY)/2-r.top};
    dsi=null;dwi=null;ds=null;return;
  }
  const p=gXY(e);stI(p.x,p.y);
}
function onTM(e){
  e.preventDefault();
  if(e.touches.length===2){
    const r=cv.getBoundingClientRect(),t1=e.touches[0],t2=e.touches[1];
    const d=Math.hypot(t1.clientX-t2.clientX,t1.clientY-t2.clientY);
    const ns=Math.max(0.2,Math.min(8,ps0*d/pd0));
    const fc={x:(pm.x-pvx0)/ps0,y:(pm.y-pvy0)/ps0};
    const mid={x:(t1.clientX+t2.clientX)/2-r.left,y:(t1.clientY+t2.clientY)/2-r.top};
    vs=ns;vx=mid.x-fc.x*ns;vy=mid.y-fc.y*ns;render();return;
  }
  const p=gXY(e);mvI(p.x,p.y);
}
function onTE(e){e.preventDefault();if(e.touches.length>0)return;enI();}
function onCK(e){
  const p=gXY(e),cp=tC(p.x,p.y);
  const si=hS(cp.x,cp.y,28);if(si>=0&&tool!=='sym'&&tool!=='wall'){showSM(si,e.clientX,e.clientY);return;}
  const wi=hW(cp.x,cp.y,14);if(wi>=0&&tool!=='wall'){showWM(wi,e.clientX,e.clientY);return;}
}
function stI(sx,sy){
  closeM();const cp=tC(sx,sy);
  const si=hS(cp.x,cp.y,28);if(si>=0){dsi=si;dp=cp;return;}
  if(tool==='pan'||tool==='none'){const wi=hW(cp.x,cp.y,14);if(wi>=0){dwi=wi;dp=cp;return;}}
  if(tool==='wall'){const sn=sEP(cp.x,cp.y,25);ds=sn||cp;dc=ds;se=false;return;}
  if(tool==='sym'&&sym){snp();S.push({type:sym,x:cp.x,y:cp.y,rot:0,label:true,id:Date.now()});updSt();render();return;}
  if(tool==='pan'){ps={x:sx,y:sy};po={x:vx,y:vy};}
}
function mvI(sx,sy){
  const cp=tC(sx,sy);
  if(dsi!==null){S[dsi].x=cp.x;S[dsi].y=cp.y;dp=cp;render();return;}
  if(dwi!==null){const dx=cp.x-dp.x,dy=cp.y-dp.y;W[dwi].sx+=dx;W[dwi].sy+=dy;W[dwi].ex+=dx;W[dwi].ey+=dy;dp=cp;render();return;}
  if(tool==='wall'&&ds){const ax=sAx(ds.x,ds.y,cp.x,cp.y);const sn=sEP(ax.x,ax.y,25);dc=sn||ax;se=!!sn;render();return;}
  if(tool==='pan'&&ps){vx=po.x+(sx-ps.x);vy=po.y+(sy-ps.y);render();return;}
}
function enI(){
  if(dsi!==null){snp();dsi=null;dp=null;updSt();return;}
  if(dwi!==null){snp();dwi=null;dp=null;return;}
  if(tool==='wall'&&ds&&dc){
    const dist=Math.hypot(dc.x-ds.x,dc.y-ds.y);
    if(dist>10/vs){
      const s={...ds},e={...dc};
      showLenDlg('Wandlänge','',len=>{
        if(len>0){const p2=ppm(),d=Math.hypot(e.x-s.x,e.y-s.y);const nx=d<.001?1:(e.x-s.x)/d,ny=d<.001?0:(e.y-s.y)/d;snp();W.push({sx:s.x,sy:s.y,ex:s.x+nx*len*p2,ey:s.y+ny*len*p2,len,thick:wt,color:wc,id:Date.now()});updSt();render();}
      });
    }
    ds=null;dc=null;se=false;render();
  }
  ps=null;
}

// ══════════════════════════════════
// ZOOM
// ══════════════════════════════════
function zIn(){const ns=Math.min(8,vs*1.25);vx=cv.width/2-(cv.width/2-vx)*ns/vs;vy=cv.height/2-(cv.height/2-vy)*ns/vs;vs=ns;render();}
function zOut(){const ns=Math.max(0.2,vs/1.25);vx=cv.width/2-(cv.width/2-vx)*ns/vs;vy=cv.height/2-(cv.height/2-vy)*ns/vs;vs=ns;render();}
function zReset(){vx=0;vy=0;vs=1;render();}

// ══════════════════════════════════
// RENDER
// ══════════════════════════════════
function render(){
  cx.clearRect(0,0,cv.width,cv.height);
  cx.fillStyle='#EFF3F8';cx.fillRect(0,0,cv.width,cv.height);
  drawGrid();
  W.forEach(w=>drawWall(w,false));
  if(ds&&dc)drawPrev();
  S.forEach((s,i)=>drawSym(s,i===dsi));
}

function drawGrid(){
  const step=50*vs;
  cx.strokeStyle='rgba(203,213,225,0.55)';cx.lineWidth=0.5;
  cx.beginPath();
  for(let x=vx%step;x<cv.width;x+=step){cx.moveTo(x,0);cx.lineTo(x,cv.height);}
  for(let y=vy%step;y<cv.height;y+=step){cx.moveTo(0,y);cx.lineTo(cv.width,y);}
  cx.stroke();
}

// DOUBLE-LINE WALL (like architectural drawings)
function drawWall(w,hl){
  const s=tS(w.sx,w.sy),e=tS(w.ex,w.ey);
  const thick=Math.max(2,w.thick*vs);
  const half=thick/2;
  // Direction vector
  const dx=e.x-s.x,dy=e.y-s.y,len=Math.hypot(dx,dy);
  if(len<1)return;
  const nx=dy/len,ny=-dx/len; // perpendicular

  // Outer offset points
  const s1={x:s.x+nx*half,y:s.y+ny*half};
  const e1={x:e.x+nx*half,y:e.y+ny*half};
  const s2={x:s.x-nx*half,y:s.y-ny*half};
  const e2={x:e.x-nx*half,y:e.y-ny*half};

  const fillClr=hl?'rgba(79,195,247,0.25)':hexToRgba(w.color,0.15);
  const lineClr=hl?'#4FC3F7':w.color;

  // Fill between lines
  cx.beginPath();
  cx.moveTo(s1.x,s1.y);cx.lineTo(e1.x,e1.y);
  cx.lineTo(e2.x,e2.y);cx.lineTo(s2.x,s2.y);
  cx.closePath();
  cx.fillStyle=fillClr;cx.fill();

  // Two outer lines
  const lw=Math.max(1.5,1.8*vs);
  cx.strokeStyle=lineClr;cx.lineWidth=lw;cx.lineCap='square';
  cx.beginPath();cx.moveTo(s1.x,s1.y);cx.lineTo(e1.x,e1.y);cx.stroke();
  cx.beginPath();cx.moveTo(s2.x,s2.y);cx.lineTo(e2.x,e2.y);cx.stroke();

  // End caps
  cx.beginPath();cx.moveTo(s1.x,s1.y);cx.lineTo(s2.x,s2.y);cx.stroke();
  cx.beginPath();cx.moveTo(e1.x,e1.y);cx.lineTo(e2.x,e2.y);cx.stroke();

  // Length label
  if(w.len){
    const mx=(s.x+e.x)/2,my=(s.y+e.y)/2;
    const fs=Math.max(10,12*vs),lbl=w.len.toFixed(2)+' m';
    cx.font=`bold ${fs}px -apple-system,sans-serif`;
    const tw=cx.measureText(lbl).width;
    const isH=Math.abs(w.ex-w.sx)>Math.abs(w.ey-w.sy);
    const lx=mx-tw/2,ly=isH?my-(half+8*vs):my-fs/2;
    cx.fillStyle='rgba(255,255,255,0.94)';cx.fillRect(lx-3,ly-fs+2,tw+6,fs+4);
    cx.fillStyle=hl?'#4FC3F7':'#1E3A8A';cx.fillText(lbl,lx,ly);
  }
}

function hexToRgba(hex,a){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return`rgba(${r},${g},${b},${a})`;
}

function drawPrev(){
  const s=tS(ds.x,ds.y),e=tS(dc.x,dc.y);
  const thick=Math.max(2,wt*vs),half=thick/2;
  const dx=e.x-s.x,dy=e.y-s.y,len=Math.hypot(dx,dy);
  if(len<1)return;
  const nx=dy/len,ny=-dx/len;
  const s1={x:s.x+nx*half,y:s.y+ny*half},e1={x:e.x+nx*half,y:e.y+ny*half};
  const s2={x:s.x-nx*half,y:s.y-ny*half},e2={x:e.x-nx*half,y:e.y-ny*half};
  cx.beginPath();cx.moveTo(s1.x,s1.y);cx.lineTo(e1.x,e1.y);cx.lineTo(e2.x,e2.y);cx.lineTo(s2.x,s2.y);cx.closePath();
  cx.fillStyle='rgba(79,195,247,0.2)';cx.fill();
  cx.strokeStyle='rgba(79,195,247,0.9)';cx.lineWidth=Math.max(1.5,1.8*vs);cx.lineCap='square';
  cx.beginPath();cx.moveTo(s1.x,s1.y);cx.lineTo(e1.x,e1.y);cx.stroke();
  cx.beginPath();cx.moveTo(s2.x,s2.y);cx.lineTo(e2.x,e2.y);cx.stroke();
  cx.beginPath();cx.moveTo(s1.x,s1.y);cx.lineTo(s2.x,s2.y);cx.stroke();
  cx.beginPath();cx.moveTo(e1.x,e1.y);cx.lineTo(e2.x,e2.y);cx.stroke();
  // snap dots
  const dr=Math.max(4,5*vs);
  cx.fillStyle='#22C55E';cx.beginPath();cx.arc(s.x,s.y,dr,0,Math.PI*2);cx.fill();
  cx.fillStyle=se?'#22C55E':'#4FC3F7';cx.beginPath();cx.arc(e.x,e.y,dr,0,Math.PI*2);cx.fill();
}

// Preloaded images cache
const _imgCache = {};
function getImg(type) {
  if (!ICONS[type]) return null;
  if (_imgCache[type]) return _imgCache[type];
  const img = new Image();
  img.src = ICONS[type];
  img.onload = () => render();
  _imgCache[type] = img;
  return img;
}

function drawSym(sym2,drag){
  const p=tS(sym2.x,sym2.y),r=Math.max(12,17*vs);
  const clr=drag?'#4FC3F7':SD[sym2.type].c;
  cx.save();
  cx.translate(p.x,p.y);cx.rotate(sym2.rot*Math.PI/180);cx.translate(-p.x,-p.y);
  // White bg circle
  cx.fillStyle='#fff';cx.beginPath();cx.arc(p.x,p.y,r,0,Math.PI*2);cx.fill();
  cx.strokeStyle=drag?'#4FC3F7':clr;cx.lineWidth=Math.max(1.5,1.8*vs);
  cx.beginPath();cx.arc(p.x,p.y,r,0,Math.PI*2);cx.stroke();
  // Draw PNG icon if available, else fallback
  const img = getImg(sym2.type);
  if (img && img.complete && img.naturalWidth > 0) {
    const sz = r * 1.4;
    cx.drawImage(img, p.x - sz, p.y - sz, sz*2, sz*2);
  } else {
    drawIcon(sym2.type,p.x,p.y,r*0.52,clr);
  }
  cx.restore();
  if(sym2.label){
    const fs=Math.max(8,9*vs),lbl=SD[sym2.type].l;
    cx.font=`600 ${fs}px -apple-system,sans-serif`;
    const tw=cx.measureText(lbl).width;
    cx.fillStyle='rgba(255,255,255,0.9)';cx.fillRect(p.x-tw/2-2,p.y+r+1,tw+4,fs+3);
    cx.fillStyle=clr;cx.fillText(lbl,p.x-tw/2,p.y+r+fs+1);
  }
}

function drawIcon(type,cx2,cy2,r,clr){
  cx.strokeStyle=clr;cx.lineWidth=Math.max(1.2,1.6*vs);cx.lineCap='round';cx.lineJoin='round';cx.fillStyle=clr;
  const PI=Math.PI;
  switch(type){
    case 'steckdose':
      // Circle + 2 pins + schutzkontakt arc bottom
      cx.beginPath();cx.arc(cx2,cy2,r,0,PI*2);cx.stroke();
      cx.beginPath();cx.moveTo(cx2-r*.38,cy2-r*.5);cx.lineTo(cx2-r*.38,cy2+r*.38);cx.stroke();
      cx.beginPath();cx.moveTo(cx2+r*.38,cy2-r*.5);cx.lineTo(cx2+r*.38,cy2+r*.38);cx.stroke();
      cx.beginPath();cx.arc(cx2,cy2+r*.38,r*.32,0,PI);cx.stroke();
      break;
    case 'schalter':
      // DIN Ausschalter: filled circle base + arm going upper-right + dot at end
      cx.beginPath();cx.arc(cx2,cy2+r*.2,r*.7,0,PI*2);cx.stroke();
      cx.beginPath();cx.moveTo(cx2,cy2-r*.5);cx.lineTo(cx2+r*1.1,cy2-r*1.4);cx.stroke();
      cx.beginPath();cx.arc(cx2+r*1.1,cy2-r*1.4,r*.22,0,PI*2);cx.fill();
      break;
    case 'wechsel':
      // DIN Wechselschalter: circle + arm with dot + second arm dashed style
      cx.beginPath();cx.arc(cx2,cy2+r*.2,r*.7,0,PI*2);cx.stroke();
      cx.beginPath();cx.moveTo(cx2,cy2-r*.5);cx.lineTo(cx2+r*1.1,cy2-r*1.4);cx.stroke();
      cx.beginPath();cx.arc(cx2+r*1.1,cy2-r*1.4,r*.22,0,PI*2);cx.fill();
      // second dashed arm
      cx.setLineDash([r*.25,r*.15]);
      cx.beginPath();cx.moveTo(cx2,cy2-r*.5);cx.lineTo(cx2+r*.8,cy2-r*.5);cx.stroke();
      cx.setLineDash([]);
      cx.beginPath();cx.arc(cx2+r*.8,cy2-r*.5,r*.22,0,PI*2);cx.fill();
      break;
    case 'kreuz':
      // DIN Kreuzschalter: circle + arm + dot, AND extra cross lines
      cx.beginPath();cx.arc(cx2,cy2+r*.2,r*.7,0,PI*2);cx.stroke();
      cx.beginPath();cx.moveTo(cx2,cy2-r*.5);cx.lineTo(cx2+r*1.1,cy2-r*1.4);cx.stroke();
      cx.beginPath();cx.arc(cx2+r*1.1,cy2-r*1.4,r*.22,0,PI*2);cx.fill();
      // cross (X) on the arm
      const ax=cx2+r*.55,ay=cy2-r*.97;
      cx.beginPath();cx.moveTo(ax-r*.2,ay-r*.2);cx.lineTo(ax+r*.2,ay+r*.2);cx.stroke();
      cx.beginPath();cx.moveTo(ax+r*.2,ay-r*.2);cx.lineTo(ax-r*.2,ay+r*.2);cx.stroke();
      break;
    case 'taster':
      // Double concentric circles
      cx.beginPath();cx.arc(cx2,cy2,r,0,PI*2);cx.stroke();
      cx.beginPath();cx.arc(cx2,cy2,r*.45,0,PI*2);cx.stroke();
      break;
    case 'verteiler':
      // Square with X inside
      cx.strokeRect(cx2-r*.8,cy2-r*.8,r*1.6,r*1.6);
      cx.beginPath();cx.moveTo(cx2-r*.55,cy2-r*.55);cx.lineTo(cx2+r*.55,cy2+r*.55);cx.stroke();
      cx.beginPath();cx.moveTo(cx2+r*.55,cy2-r*.55);cx.lineTo(cx2-r*.55,cy2+r*.55);cx.stroke();
      break;
    case 'sicherung':
      // Rectangle with 3 lines inside
      cx.strokeRect(cx2-r*.9,cy2-r*.65,r*1.8,r*1.3);
      cx.beginPath();cx.moveTo(cx2-r*.65,cy2-r*.22);cx.lineTo(cx2+r*.65,cy2-r*.22);cx.stroke();
      cx.beginPath();cx.moveTo(cx2-r*.65,cy2);cx.lineTo(cx2+r*.65,cy2);cx.stroke();
      cx.beginPath();cx.moveTo(cx2-r*.65,cy2+r*.22);cx.lineTo(cx2+r*.65,cy2+r*.22);cx.stroke();
      break;
    case 'data':
      // T-shape: vertical line + 2 horizontal lines at bottom
      cx.beginPath();cx.moveTo(cx2,cy2-r*.9);cx.lineTo(cx2,cy2+r*.2);cx.stroke();
      cx.beginPath();cx.moveTo(cx2-r*.8,cy2+r*.2);cx.lineTo(cx2+r*.8,cy2+r*.2);cx.stroke();
      cx.beginPath();cx.moveTo(cx2-r*.8,cy2+r*.7);cx.lineTo(cx2+r*.8,cy2+r*.7);cx.stroke();
      break;
    case 'licht':
      // Sun: small circle + 8 rays
      cx.beginPath();cx.arc(cx2,cy2,r*.42,0,PI*2);cx.stroke();
      for(let i=0;i<8;i++){const a=i*PI/4;cx.beginPath();cx.moveTo(cx2+r*.58*Math.cos(a),cy2+r*.58*Math.sin(a));cx.lineTo(cx2+r*.95*Math.cos(a),cy2+r*.95*Math.sin(a));cx.stroke();}
      break;
    case 'leuchte':
      // Circle with X (Ⓧ symbol - standard for Leuchte/lamp)
      cx.beginPath();cx.arc(cx2,cy2,r*.9,0,PI*2);cx.stroke();
      cx.beginPath();cx.moveTo(cx2-r*.6,cy2-r*.6);cx.lineTo(cx2+r*.6,cy2+r*.6);cx.stroke();
      cx.beginPath();cx.moveTo(cx2+r*.6,cy2-r*.6);cx.lineTo(cx2-r*.6,cy2+r*.6);cx.stroke();
      break;
    case 'spot':
      // Circle + filled inner circle (Einbauleuchte)
      cx.beginPath();cx.arc(cx2,cy2,r*.9,0,PI*2);cx.stroke();
      cx.globalAlpha=0.4;cx.beginPath();cx.arc(cx2,cy2,r*.4,0,PI*2);cx.fill();cx.globalAlpha=1;
      cx.beginPath();cx.arc(cx2,cy2,r*.4,0,PI*2);cx.stroke();
      break;
  }
}

// ══════════════════════════════════
// STATS
// ══════════════════════════════════
function updSt(){
  document.getElementById('cwalls').textContent=W.length+' Wände';
  document.getElementById('celems').textContent=S.length+' Elemente';
  let tot=0;W.forEach(w=>tot+=(w.len||0));
  const td=document.getElementById('stotal');
  if(tot>0){td.style.display='flex';document.getElementById('stotalT').textContent='Gesamt: '+tot.toFixed(1)+' m';}
  else td.style.display='none';
  const counts={};S.forEach(s=>counts[s.type]=(counts[s.type]||0)+1);
  const sc=document.getElementById('schips');sc.innerHTML='';
  Object.entries(counts).forEach(([t,n])=>{
    const c=SD[t].c;
    const chip=document.createElement('div');chip.className='sc';
    chip.style=`background:${c}20;border:1px solid ${c}50;color:${c}`;
    chip.innerHTML=`<div style="width:7px;height:7px;border-radius:50%;background:${c}"></div>${SD[t].s}: ${n}`;
    sc.appendChild(chip);
  });
}

// ══════════════════════════════════
// CONTEXT MENUS
// ══════════════════════════════════
function showSM(i,x,y){
  const m=document.getElementById('cm'),s=S[i];
  m.innerHTML=`
    <button class="ci" onclick="rotS(${i});closeM()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0118.8-4.3M22 12.5a10 10 0 01-18.8 4.2"/></svg>Drehen 90°</button>
    <button class="ci" onclick="dupS(${i});closeM()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>Duplizieren</button>
    <button class="ci" onclick="togL(${i});closeM()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z"/></svg>${s.label?'Label aus':'Label ein'}</button>
    <div class="csep"></div>
    <button class="ci d" onclick="delS(${i});closeM()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/></svg>Löschen</button>`;
  posM(m,x,y);
}
function showWM(i,x,y){
  const m=document.getElementById('cm');
  m.innerHTML=`
    <button class="ci" onclick="editWL(${i});closeM()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>Länge ändern</button>
    <button class="ci" onclick="setWT(${i},3);closeM()">Dünn</button>
    <button class="ci" onclick="setWT(${i},6);closeM()">Normal</button>
    <button class="ci" onclick="setWT(${i},12);closeM()">Dick</button>
    <div class="csep"></div>
    <button class="ci d" onclick="delW(${i});closeM()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/></svg>Löschen</button>`;
  posM(m,x,y);
}
function posM(m,x,y){m.classList.add('s');const mw=m.offsetWidth||190,mh=m.offsetHeight||200;m.style.left=Math.min(x,window.innerWidth-mw-8)+'px';m.style.top=Math.min(y,window.innerHeight-mh-8)+'px';}
function closeM(){document.getElementById('cm').classList.remove('s');document.getElementById('dd').classList.remove('s');}
document.addEventListener('click',e=>{
  if(!e.target.closest('#cm'))document.getElementById('cm').classList.remove('s');
  if(!e.target.closest('#dd')&&!e.target.closest('#menu-btn'))document.getElementById('dd').classList.remove('s');
});

function rotS(i){snp();S[i].rot=(S[i].rot+90)%360;render();}
function dupS(i){snp();S.push({...S[i],x:S[i].x+30,y:S[i].y+30,id:Date.now()});updSt();render();}
function togL(i){snp();S[i].label=!S[i].label;render();}
function delS(i){snp();S.splice(i,1);updSt();render();}
function editWL(i){
  const w=W[i];showLenDlg('Länge ändern',w.len||'',len=>{
    if(len>0){snp();const d=Math.hypot(w.ex-w.sx,w.ey-w.sy);const nx=d<.001?1:(w.ex-w.sx)/d,ny=d<.001?0:(w.ey-w.sy)/d;const p2=ppm();W[i].ex=w.sx+nx*len*p2;W[i].ey=w.sy+ny*len*p2;W[i].len=len;updSt();render();}
  });
}
function setWT(i,t){snp();W[i].thick=t;render();}
function delW(i){snp();W.splice(i,1);updSt();render();}

// ══════════════════════════════════
// DIALOGS
// ══════════════════════════════════
function showLenDlg(title,def,cb){
  document.getElementById('dlent').textContent=title;
  const inp=document.getElementById('dleni');inp.value=def||'';lcb=cb;
  document.getElementById('dlen').classList.add('s');setTimeout(()=>inp.focus(),100);
}
function okLen(){const v=parseFloat(document.getElementById('dleni').value.replace(',','.'));cDlg('dlen');if(lcb){lcb(v||0);lcb=null;}}
document.getElementById('dleni').addEventListener('keydown',e=>{if(e.key==='Enter')okLen();});

function cDlg(id){document.getElementById(id).classList.remove('s');}

function showNDlg(title,def,cb){
  document.getElementById('dnamet').textContent=title;
  document.getElementById('dnamei').value=def||'';ncb=cb;
  document.getElementById('dname').classList.add('s');setTimeout(()=>document.getElementById('dnamei').focus(),100);
}
function okName(){const v=document.getElementById('dnamei').value.trim();cDlg('dname');if(ncb){ncb(v);ncb=null;}}
document.getElementById('dnamei').addEventListener('keydown',e=>{if(e.key==='Enter')okName();});

function showConf(title,text,cb){
  document.getElementById('dconft').textContent=title;document.getElementById('dconfp').textContent=text;
  document.getElementById('dconfok').onclick=()=>{cDlg('dconf');if(cb)cb();};
  document.getElementById('dconf').classList.add('s');
}

// ══════════════════════════════════
// PROJECT
// ══════════════════════════════════
function toggleDD(){document.getElementById('dd').classList.toggle('s');}
function newProj(){closeM();showConf('Neues Projekt','Aktuelles Projekt verwerfen?',()=>{W=[];S=[];US=[];RS=[];pn='Neues Projekt';document.getElementById('plbl').textContent=pn;updUR();updSt();render();});}
function saveProj(){
  closeM();const data={name:pn,walls:W,symbols:S};
  const all=loadAll();const idx=all.findIndex(p=>p.name===pn);
  if(idx>=0)all[idx]=data;else all.push(data);
  localStorage.setItem('ep',JSON.stringify(all));toast('✅ "'+pn+'" gespeichert');
}
function openProj(){
  closeM();const all=loadAll();
  if(!all.length){toast('Keine gespeicherten Projekte');return;}
  const list=document.getElementById('dopenL');list.innerHTML='';
  all.forEach(p=>{
    const btn=document.createElement('button');
    btn.style='width:100%;text-align:left;padding:12px;background:none;border:none;color:#fff;cursor:pointer;border-radius:8px;';
    btn.innerHTML=`<div style="font-weight:600">${p.name}</div><div style="font-size:12px;color:#6B7280">${(p.walls||[]).length} Wände · ${(p.symbols||[]).length} Elemente</div>`;
    btn.onmouseover=()=>btn.style.background='rgba(255,255,255,.05)';btn.onmouseout=()=>btn.style.background='none';
    btn.onclick=()=>{W=p.walls||[];S=p.symbols||[];pn=p.name;document.getElementById('plbl').textContent=pn;US=[];RS=[];updUR();updSt();render();cDlg('dopen');};
    list.appendChild(btn);
  });
  document.getElementById('dopen').classList.add('s');
}
function renameProj(){closeM();showNDlg('Umbenennen',pn,name=>{if(name){pn=name;document.getElementById('plbl').textContent=name;}});}
function dupProj(){closeM();const nn=pn+' (Kopie)';const all=loadAll();all.push({name:nn,walls:JSON.parse(JSON.stringify(W)),symbols:JSON.parse(JSON.stringify(S))});localStorage.setItem('ep',JSON.stringify(all));toast('✅ Dupliziert als "'+nn+'"');}
function loadAll(){try{return JSON.parse(localStorage.getItem('ep')||'[]');}catch{return[];}}
function confirmClear(){closeM();showConf('Alles löschen?','Alle Wände und Elemente werden gelöscht.',()=>{snp();W=[];S=[];updSt();render();});}

function toast(msg){
  let t=document.getElementById('toast');
  if(!t){t=document.createElement('div');t.id='toast';t.style='position:fixed;bottom:60px;left:50%;transform:translateX(-50%);background:#059669;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;z-index:9999;pointer-events:none;transition:opacity .3s';document.body.appendChild(t);}
  t.textContent=msg;t.style.opacity='1';clearTimeout(t._t);t._t=setTimeout(()=>t.style.opacity='0',2500);
}

updSt();setSt('← Werkzeug wählen','#6B7280');render();
</script>
